<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理栄養士国家試験対策</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .hide { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center">

    <!-- スマホ風コンテナ -->
    <div id="app" class="w-full max-w-md bg-white min-h-screen shadow-2xl flex flex-col relative overflow-hidden pb-20">
        
        <!-- ヘッダー -->
        <header id="header" class="bg-emerald-700 text-white px-4 py-3 flex items-center justify-between shadow-md sticky top-0 z-10">
            <div class="flex items-center space-x-2">
                <button id="back-btn" class="hide text-xl px-2"><i class="fa-solid fa-chevron-left"></i></button>
                <h1 id="header-title" class="text-lg font-bold">管理栄養士 試験対策</h1>
            </div>
            <div id="header-right" class="text-sm"></div>
        </header>

        <!-- メインコンテンツ領域 -->
        <main id="main-content" class="flex-1 p-4 overflow-y-auto">
            <!-- 動的に画面が切り替わります -->
        </main>

        <!-- ボトムナビゲーション -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 shadow-lg z-10">
            <button onclick="router('home')" class="flex flex-col items-center text-emerald-700 text-xs font-semibold focus:outline-none">
                <i class="fa-solid fa-house text-lg mb-1"></i>ホーム
            </button>
            <button onclick="router('study')" class="flex flex-col items-center text-gray-400 text-xs font-semibold focus:outline-none">
                <i class="fa-solid fa-book-open text-lg mb-1"></i>学習
            </button>
            <button onclick="router('stats')" class="flex flex-col items-center text-gray-400 text-xs font-semibold focus:outline-none">
                <i class="fa-solid fa-chart-bar text-lg mb-1"></i>成績
            </button>
            <button onclick="router('mypage')" class="flex flex-col items-center text-gray-400 text-xs font-semibold focus:outline-none">
                <i class="fa-solid fa-user text-lg mb-1"></i>マイページ
            </button>
        </nav>
    </div>

    <script>
        // --- アプリの状態管理 ---
        let state = {
            currentScreen: 'home',
            stats: { answered: 0, correct: 0, bookmarks: 0 }
        };

        // --- ルーター（画面切り替え） ---
        function router(screen, param) {
            state.currentScreen = screen;
            const main = document.getElementById('main-content');
            const backBtn = document.getElementById('back-btn');
            const titleEl = document.getElementById('header-title');
            
            backBtn.classList.add('hide');
            main.innerHTML = '';

            if (screen === 'home') {
                titleEl.innerText = "管理栄養士 試験対策";
                renderHome(main);
            } else if (screen === 'study') {
                titleEl.innerText = "学習モード選択";
                renderStudy(main);
            } else if (screen === 'stats') {
                titleEl.innerText = "学習統計";
                renderStats(main);
            } else if (screen === 'mypage') {
                titleEl.innerText = "マイページ";
                renderMyPage(main);
            } else if (screen === 'quiz_years') {
                backBtn.classList.remove('hide');
                backBtn.onclick = () => router('study');
                titleEl.innerText = "年度別を選択";
                renderYearsList(main);
            } else if (screen === 'quiz_play') {
                backBtn.classList.remove('hide');
                backBtn.onclick = () => router('study');
                titleEl.innerText = param ? `${param}の過去問` : "問題演習";
                renderQuizPlay(main, param);
            }
        }

        // --- ホーム画面 ---
        function renderHome(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 shadow-sm">
                        <span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold">学習中の資格</span>
                        <h2 class="text-base font-bold mt-2 text-emerald-900">管理栄養士 国家試験</h2>
                        <p class="text-xs text-gray-600 mt-1">次回試験：2027年3月（年1回実施）</p>
                    </div>

                    <div onclick="router('quiz_play', '今日の5問')" class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-xl p-4 shadow-md flex items-center justify-between cursor-pointer">
                        <div>
                            <span class="text-xs bg-emerald-800 px-2 py-0.5 rounded font-semibold">一般向け・AI</span>
                            <h3 class="font-bold text-lg mt-1"><i class="fa-solid fa-fire mr-1"></i> 今日の5問</h3>
                            <p class="text-xs text-emerald-100">サクッと5問だけ解いて実力アップ</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-lg"></i>
                    </div>

                    <div>
                        <h3 class="font-bold text-sm text-gray-700 mb-2">クイックスタート</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div onclick="router('quiz_years')" class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm flex flex-col items-center justify-center text-center cursor-pointer hover:bg-gray-50">
                                <i class="fa-solid fa-calendar-days text-emerald-600 text-xl mb-1"></i>
                                <span class="text-xs font-bold text-gray-800">年度別</span>
                                <span class="text-[10px] text-gray-500">1〜40回過去問</span>
                            </div>
                            <div onclick="router('study')" class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm flex flex-col items-center justify-center text-center cursor-pointer hover:bg-gray-50">
                                <i class="fa-solid fa-brain text-emerald-600 text-xl mb-1"></i>
                                <span class="text-xs font-bold text-gray-800">AI復習問題集</span>
                                <span class="text-[10px] text-gray-500">管理栄養士向け</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 学習モード選択画面 ---
        function renderStudy(container) {
            container.innerHTML = `
                <div class="space-y-3">
                    <div onclick="router('quiz_years')" class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex items-center justify-between cursor-pointer">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-lg bg-emerald-100 flex items-center justify-center text-emerald-700"><i class="fa-solid fa-calendar-days"></i></div>
                            <div>
                                <h3 class="font-bold text-sm">年度別</h3>
                                <p class="text-xs text-gray-500">試験回ごとに問題を解く（第1〜40回）</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-400"></i>
                    </div>

                    <div onclick="router('quiz_play', '科目別学習')" class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex items-center justify-between cursor-pointer">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-lg bg-emerald-100 flex items-center justify-center text-emerald-700"><i class="fa-solid fa-book"></i></div>
                            <div>
                                <h3 class="font-bold text-sm">科目別・分野別</h3>
                                <p class="text-xs text-gray-500">基礎栄養学、臨床栄養学などカテゴリ別</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-400"></i>
                    </div>

                    <div onclick="router('quiz_play', '間違えた問題')" class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex items-center justify-between cursor-pointer">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-lg bg-red-100 flex items-center justify-center text-red-600"><i class="fa-solid fa-xmark"></i></div>
                            <div>
                                <h3 class="font-bold text-sm">間違えた問題の復習</h3>
                                <p class="text-xs text-gray-500">過去に不正解だった問題を解き直す</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-400"></i>
                    </div>

                    <div onclick="router('quiz_play', 'AIレコメンド問題集')" class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex items-center justify-between cursor-pointer">
                        <div class="bg-gradient-to-r from-teal-500 to-emerald-600 text-white rounded-xl p-4 w-full flex items-center justify-between">
                            <div>
                                <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded font-bold">現役管理栄養士向け</span>
                                <h3 class="font-bold text-sm mt-1">AI算出・弱点克服問題集</h3>
                                <p class="text-xs text-teal-100">AIが苦手分野を分析して自動生成</p>
                            </div>
                            <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 年度別一覧画面 ---
        function renderYearsList(container) {
            let html = '<div class="space-y-2">';
            // 第40回から第1回までを自動生成
            for (let i = 40; i >= 1; i--) {
                html += `
                    <div onclick="router('quiz_play', '第${i}回国家試験')" class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm flex items-center justify-between cursor-pointer hover:bg-emerald-50">
                        <div>
                            <h3 class="font-bold text-sm text-gray-800">第${i}回 管理栄養士国家試験</h3>
                            <p class="text-[11px] text-gray-500">全200問（※全員正解等除外済）</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
                    </div>
                `;
            }
            html += '</div>';
            container.innerHTML = html;
        }

        // --- クイズプレイ画面（サンプル問題データ連動） ---
        function renderQuizPlay(container, modeName) {
            // ここで外部JSON（例: data/y40.json）を fetch する設計の土台
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-center text-xs text-gray-500 font-bold">
                        <span>モード: ${modeName || '一般'}</span>
                        <span>1 / 5 問</span>
                    </div>
                    <div class="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-emerald-600 h-full w-1/5"></div>
                    </div>

                    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm space-y-3">
                        <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">基礎栄養学</span>
                        <p class="text-sm font-bold text-gray-800">Q. 吸収された栄養素の体内動態に関する記述である。最も適当なものを1つ選べ。</p>
                        
                        <div class="space-y-2 pt-2">
                            <div class="p-3 border border-gray-200 rounded-lg text-xs hover:bg-gray-50 cursor-pointer">1. 中鎖脂肪酸はカイロミクロンに組み込まれリンパ管経由で運ばれる...</div>
                            <div class="p-3 border border-gray-200 rounded-lg text-xs hover:bg-gray-50 cursor-pointer">2. アミノ酸は小腸から吸収された後にリンパ管に入り、肝臓を経由せず...</div>
                            <div class="p-3 border border-emerald-500 bg-emerald-50 text-emerald-900 font-bold rounded-lg text-xs cursor-pointer flex justify-between items-center">
                                <span>5. 長鎖脂肪酸はミセル化された後にリンパ管を経由して全身循環に入り...</span>
                                <i class="fa-solid fa-check text-emerald-600"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs space-y-1">
                        <p class="font-bold text-amber-900"><i class="fa-solid fa-lightbulb mr-1"></i> 解説</p>
                        <p class="text-amber-800 leading-relaxed">長鎖脂肪酸は小腸上皮細胞内でトリアシルグリセロールに再合成されカイロミクロンに組み込まれ...</p>
                    </div>

                    <button onclick="alert('次の問題へ進みます（サンプル）')" class="w-full bg-emerald-700 text-white font-bold py-3 rounded-xl shadow text-sm">
                        次の問題へ <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                </div>
            `;
        }

        // --- 成績統計画面 ---
        function renderStats(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm grid grid-cols-3 text-center">
                        <div>
                            <p class="text-xs text-gray-500">回答済み</p>
                            <p class="text-lg font-bold text-gray-800">4</p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500">正解数</p>
                            <p class="text-lg font-bold text-emerald-600">0</p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500">正答率</p>
                            <p class="text-lg font-bold text-gray-800">0%</p>
                        </div>
                    </div>

                    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm space-y-3">
                        <h3 class="font-bold text-sm text-gray-800">科目別正答率</h3>
                        <div class="text-xs space-y-2">
                            <div>
                                <div class="flex justify-between mb-1"><span>基礎栄養学</span><span class="text-emerald-600 font-bold">0%</span></div>
                                <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden"><div class="bg-emerald-600 h-full w-[40%]"></div></div>
                            </div>
                            <div>
                                <div class="flex justify-between mb-1"><span>臨床栄養学</span><span class="text-gray-400">-</span></div>
                                <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden"><div class="bg-gray-300 h-full w-0"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- マイページ画面 ---
        function renderMyPage(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex items-center space-x-3">
                        <div class="w-12 h-12 bg-emerald-700 text-white rounded-full flex items-center justify-center font-bold text-lg">管理</div>
                        <div>
                            <h3 class="font-bold text-sm text-gray-800">管理栄養士 ユーザー</h3>
                            <p class="text-xs text-gray-500">目標：第41回国家試験 合格</p>
                        </div>
                    </div>
                    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm space-y-2 text-xs">
                        <p class="font-bold text-gray-700">アプリ設定・データ管理</p>
                        <button onclick="alert('データを同期しました')" class="w-full text-left py-2 border-b border-gray-100 flex justify-between items-center">
                            <span>学習データのバックアップ / 同期</span><i class="fa-solid fa-chevron-right text-gray-400"></i>
                        </button>
                        <button onclick="alert('キャッシュをクリアしました')" class="w-full text-left py-2 flex justify-between items-center text-red-600">
                            <span>キャッシュのクリア</span><i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // 初期描画
        document.addEventListener("DOMContentLoaded", () => {
            router('home');
        });
    </script>
</body>
</html>

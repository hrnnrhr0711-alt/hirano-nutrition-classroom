
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらのの栄養教室</title>
<style>
body{
  font-family:system-ui,sans-serif;
  background:#f4f8f6;
  color:#234;
  max-width:780px;
  margin:auto;
  padding:16px;
}
header,.card{
  background:white;
  border:1px solid #dce8e1;
  border-radius:14px;
  padding:18px;
  margin:12px 0;
}
h1{
  color:#116e67;
  font-size:1.5rem;
}
button,select{
  font:inherit;
  padding:11px;
  border-radius:9px;
  border:1px solid #116e67;
  background:white;
  color:#116e67;
}
button{cursor:pointer}
button.primary{
  background:#116e67;
  color:white;
}
.choices{
  display:grid;
  gap:9px;
  margin:14px 0;
}
.choices button{text-align:left}
.choices button.selected{background:#d6eee4}
label{display:block;margin:12px 0 5px}
.muted{color:#667;font-size:.9rem}
.hidden{display:none}
.feedback{
  padding:12px;
  background:#e8f4ef;
  border-radius:9px;
  white-space:pre-wrap;
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.row>*{flex:1}
input[type=checkbox]{margin-right:8px}
</style>
</head>

<body>
<header>
<h1>ひらのの栄養教室</h1>
<p>管理栄養士と学ぶ、食と健康のクイズ</p>
<p class="muted">
公式確認・校閲済みの問題だけを出題します。
</p>
</header>

<main>
<section class="card">
<label for="exam">試験回</label>
<select id="exam">
<option value="all">全年度</option>
</select>

<label for="mode">学習モード</label>
<select id="mode">
<option value="exam">国家試験（正答を選択）</option>
<option value="ox">選択肢○×</option>
<option value="daily">今日の5問</option>
<option value="review">間違えた問題の復習</option>
</select>

<p>
<button class="primary" id="start">
出題する
</button>
</p>

<p class="muted" id="loadStatus">
問題データを読み込み中...
</p>
</section>

<section class="card hidden" id="quiz">
<p id="counter" class="muted"></p>
<h2 id="question"></h2>
<p id="hint" class="muted"></p>
<div id="choices" class="choices"></div>

<div class="row">
<button class="primary" id="grade">
回答を確定
</button>
<button id="next" disabled>
次の問題
</button>
</div>

<p id="feedback" class="feedback hidden"></p>
</section>
</main>

<script>
'use strict';

const $=id=>document.getElementById(id);
const PROGRESS='hirano-progress-v2';

let questions=[];
let queue=[];
let position=0;
let selected=[];
let active=null;
let mode='exam';

function parseSets(q){
  if(Array.isArray(q.answerSets)){
    return q.answerSets.map(s=>
      Array.isArray(s)?s.map(Number):[]
    );
  }

  if(Array.isArray(q.correctAnswers)){
    return [q.correctAnswers.map(Number)];
  }

  if(Number.isInteger(q.answer)){
    return [[
      q.answer+(q.answerBase===0?1:0)
    ]];
  }

  return [];
}

function normalize(q){
  if(!q||typeof q!=='object')return null;

  const exam=Number(q.examNumber);
  const n=Number(q.questionNumber);

  if(
    !Number.isInteger(exam)||
    exam<1||
    exam>40||
    !Number.isInteger(n)||
    n<1
  )return null;

  const opts=Array.isArray(q.options)
    ?q.options.map(o=>
      typeof o==='string'
        ?{text:o,explanation:''}
        :{
          text:String(o?.text||''),
          explanation:String(o?.explanation||'')
        }
    )
    :[];

  if(opts.length!==5)return null;

  const sets=parseSets(q);
  const count=Number(q.selectionCount||1);

  const valid=
    Number.isInteger(count)&&
    count>=1&&
    count<=5&&
    sets.length>0&&
    sets.every(s=>
      s.length===count&&
      new Set(s).size===s.length&&
      s.every(x=>
        Number.isInteger(x)&&
        x>=1&&
        x<=5
      )
    );

  if(!valid)return null;

  const scoring=q.scoringStatus;

  if(
    scoring!=='normal'&&
    scoring!=='multipleAccepted'
  )return null;

  if(
    q.reviewStatus!=='ready'||
    q.officialChecked!==true||
    q.verified!==true
  )return null;

  if(q.needsFigure&&!q.figurePath)return null;

  if(
    scoring==='multipleAccepted'&&
    (!q.officialNoticeUrl||sets.length<2)
  )return null;

  return {
    ...q,
    id:`${exam}-${String(n).padStart(3,'0')}`,
    examNumber:exam,
    questionNumber:n,
    options:opts,
    answerSets:sets,
    selectionCount:count
  };
}

function hash(s){
  let h=2166136261;

  for(const c of s){
    h^=c.charCodeAt(0);
    h=Math.imul(h,16777619);
  }

  return h>>>0;
}

function getProgress(){
  try{
    return JSON.parse(
      localStorage.getItem(PROGRESS)||'{}'
    );
  }catch{
    return {};
  }
}

function saveProgress(p){
  try{
    localStorage.setItem(
      PROGRESS,
      JSON.stringify(p)
    );
  }catch{}
}

async function load(){
  try{
    const r=await fetch(
      'questions.json?ts='+Date.now(),
      {cache:'no-store'}
    );

    if(!r.ok)throw Error('未公開');

    const raw=await r.json();

    const items=Array.isArray(raw)
      ?raw
      :Array.isArray(raw.questions)
        ?raw.questions
        :[];

    questions=items.map(normalize).filter(Boolean);

    const exams=[
      ...new Set(
        questions.map(q=>q.examNumber)
      )
    ].sort((a,b)=>b-a);

    for(const n of exams){
      const o=document.createElement('option');
      o.value=n;
      o.textContent=`第${n}回`;
      $('exam').append(o);
    }

    $('loadStatus').textContent=
      `公開条件を満たす問題：${questions.length}問。`;

    if(!questions.length){
      $('loadStatus').textContent+=
        ' 公式照合・校閲済みのデータ公開をお待ちください。';
    }

  }catch{
    $('loadStatus').textContent=
      '公開問題データはまだ登録されていません。'+
      'questions.jsonの公開後に利用できます。';
  }
}

function start(){
  mode=$('mode').value;

  const e=$('exam').value;

  let items=questions.filter(q=>
    e==='all'||q.examNumber===Number(e)
  );

  if(mode==='ox'){
    items=items.filter(q=>
      Array.isArray(q.optionsCorrect)&&
      q.optionsCorrect.length===5&&
      q.optionsCorrect.every(x=>
        typeof x==='boolean'
      )
    ).flatMap(q=>
      q.options.map((o,i)=>({
        ...q,
        id:q.id+'-ox-'+(i+1),
        oxIndex:i
      }))
    );
  }

  if(mode==='review'){
    const p=getProgress();

    items=items.filter(q=>
      (p[q.id]?.wrong||0)>0
    );
  }

  if(mode==='daily'){
    const day=new Date().toLocaleDateString('sv-SE');

    items.sort((a,b)=>
      hash(a.id+day)-hash(b.id+day)
    );

    items=items.slice(0,5);

  }else{
    items.sort((a,b)=>
      a.examNumber===b.examNumber
        ?a.questionNumber-b.questionNumber
        :b.examNumber-a.examNumber
    );
  }

  if(!items.length){
    alert('この条件で出題できる問題がありません。');
    return;
  }

  queue=items;
  position=0;

  $('quiz').classList.remove('hidden');
  show();
}

function show(){
  active=queue[position];
  selected=[];

  $('counter').textContent=
    `${position+1} / ${queue.length}｜`+
    `第${active.examNumber}回 問${active.questionNumber}`;

  $('question').textContent=active.question;

  $('hint').textContent=mode==='ox'
    ?`選択肢${active.oxIndex+1}の記述は正しいですか？`
    :`${active.selectionCount}つ選んでください。`;

  $('choices').replaceChildren();

  const opts=mode==='ox'
    ?['○ 正しい','× 誤り']
    :active.options.map((o,i)=>
      `${i+1}. ${o.text}`
    );

  opts.forEach((s,i)=>{
    const b=document.createElement('button');
    b.textContent=s;

    b.onclick=()=>{
      if(
        mode==='ox'||
        active.selectionCount===1
      ){
        selected=[i];

      }else{
        if(selected.includes(i)){
          selected=selected.filter(x=>x!==i);

        }else if(
          selected.length<active.selectionCount
        ){
          selected.push(i);
        }
      }

      [...$('choices').children].forEach((c,j)=>
        c.classList.toggle(
          'selected',
          selected.includes(j)
        )
      );
    };

    $('choices').append(b);
  });

  $('grade').disabled=false;
  $('next').disabled=true;
  $('feedback').classList.add('hidden');
}

function grade(){
  if(
    selected.length!==(
      mode==='ox'?1:active.selectionCount
    )
  ){
    alert('指定された数の選択肢を選んでください。');
    return;
  }

  let correct;
  let answer;

  if(mode==='ox'){
    const truth=
      active.optionsCorrect[active.oxIndex];

    correct=selected[0]===(truth?0:1);
    answer=truth?'○':'×';

  }else{
    const sorted=[...selected]
      .map(x=>x+1)
      .sort((a,b)=>a-b)
      .join(',');

    correct=active.answerSets.some(s=>
      [...s].sort((a,b)=>a-b).join(',')===sorted
    );

    answer=active.answerSets
      .map(s=>s.join('・'))
      .join(' または ');
  }

  const p=getProgress();
  const id=active.id;

  p[id]??={right:0,wrong:0};

  p[id][correct?'right':'wrong']++;

  saveProgress(p);

  let message=
    `${correct?'正解':'不正解'}\n`+
    `正答：${answer}\n`+
    `${active.explanation||''}`;

  if(mode==='ox'){
    message+='\n'+(
      active.options[active.oxIndex]
        .explanation||''
    );

  }else{
    message+='\n'+active.options
      .map((o,i)=>
        `${i+1}. ${o.explanation}`
      )
      .join('\n');
  }

  if(active.scoringStatus==='multipleAccepted'){
    message+=
      '\n※公式に複数の正答が認められた問題です。';
  }

  $('feedback').textContent=message;
  $('feedback').classList.remove('hidden');

  $('grade').disabled=true;
  $('next').disabled=false;
}

$('start').onclick=start;
$('grade').onclick=grade;

$('next').onclick=()=>{
  position++;

  if(position>=queue.length){
    $('quiz').classList.add('hidden');
    alert('この範囲の学習が完了しました。');
    return;
  }

  show();
};

load();
</script>
</body>
</html>

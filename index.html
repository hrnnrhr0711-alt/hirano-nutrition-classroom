
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらのの栄養教室</title>
<style>
:root{
  --main:#167568;
  --bg:#f5f8f7;
  --text:#263c38;
  --light:#e9f5ef;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:var(--main);
  color:white;
  padding:24px 15px;
  text-align:center;
}
header h1{margin:0;font-size:26px}
header p{font-size:13px}
main{max-width:760px;margin:auto;padding:16px}
.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:16px;
  box-shadow:0 2px 8px #0000000a;
}
h2{font-size:20px;margin-top:0}
p{line-height:1.7}
button{
  font:inherit;
  border:1px solid #cbded6;
  background:white;
  color:var(--text);
  padding:13px;
  border-radius:11px;
  cursor:pointer;
}
button:disabled{opacity:.5}
.primary{
  background:var(--main);
  color:white;
  border-color:var(--main);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.grid button{text-align:left}
.grid small{
  display:block;
  color:#728780;
  font-size:12px;
  margin-top:5px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.stat{
  background:var(--light);
  padding:12px 4px;
  border-radius:12px;
  text-align:center;
}
.stat strong{display:block;font-size:25px}
.stat small{font-size:11px}
.progress{
  background:#e1ebe6;
  height:10px;
  border-radius:10px;
  overflow:hidden;
}
.progress div{
  background:#29a48b;
  height:100%;
}
.choice{
  display:block;
  width:100%;
  text-align:left;
  margin:9px 0;
  line-height:1.7;
}
.selected{
  border:2px solid var(--main);
  background:var(--light);
}
.correct{
  border:2px solid #289b61;
  background:#e5f8ed;
}
.wrong{
  border:2px solid #cf5555;
  background:#fff0f0;
}
.explain{
  background:var(--light);
  padding:15px;
  border-radius:12px;
  line-height:1.9;
  white-space:pre-wrap;
}
.row{display:flex;gap:10px;margin-top:15px}
.row button{flex:1}
.hidden{display:none!important}
.muted{color:#728780;font-size:13px}
.tag{
  display:inline-block;
  background:var(--light);
  color:var(--main);
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
}
.admin-link{
  position:fixed;
  right:9px;
  bottom:calc(9px + env(safe-area-inset-bottom));
  font-size:10px;
  color:#8da29a;
  background:#ffffffd9;
  padding:5px 8px;
  border-radius:7px;
  text-decoration:none;
  z-index:10;
}
footer{
  text-align:center;
  padding:30px 10px 55px;
  color:#728780;
  font-size:12px;
}
</style>
</head>
<body>

<header>
  <h1>ひらのの栄養教室</h1>
  <p>管理栄養士と学ぶ、食と健康のクイズ</p>
</header>

<main>

<section id="home">

<div class="card">
  <h2>学習ステータス</h2>
  <div class="stats">
    <div class="stat">
      <strong id="level">1</strong>
      <small>レベル</small>
    </div>
    <div class="stat">
      <strong id="rate">0%</strong>
      <small>正答率</small>
    </div>
    <div class="stat">
      <strong id="streak">0</strong>
      <small>連続学習日数</small>
    </div>
  </div>
  <p id="xpText" class="muted"></p>
  <div class="progress"><div id="xpBar"></div></div>
  <p id="dueText" class="muted"></p>
</div>

<div class="card">
  <h2>学習コース</h2>
  <div class="grid">
    <button onclick="start('exam')">
      国家試験5択
      <small>公式過去問に挑戦</small>
    </button>
    <button onclick="start('ox')">
      選択肢○×
      <small>各選択肢を判定</small>
    </button>
    <button onclick="start('easy')">
      やさしい国試
      <small>一般向けの基礎問題</small>
    </button>
    <button onclick="start('life')">
      暮らしの栄養
      <small>生活に役立つクイズ</small>
    </button>
    <button onclick="start('daily')">
      今日の5問
      <small>毎日の学習習慣</small>
    </button>
    <button onclick="start('review')">
      復習する
      <small>復習予定の問題</small>
    </button>
  </div>
</div>

<div class="card">
  <h2>学習のポイント</h2>
  <p>まず自分で答えを考え、解答後にすべての選択肢の解説を確認しましょう。</p>
  <p>間違えた問題は復習リストに登録されます。</p>
</div>

<div class="card">
  <h2>学習記録のバックアップ</h2>
  <button onclick="backup()">バックアップ保存</button>
  <button onclick="document.getElementById('restoreFile').click()">
    バックアップ復元
  </button>
  <input id="restoreFile" type="file" accept=".json"
    class="hidden" onchange="restore(event)">
  <p class="muted">
    学習記録はこのブラウザに保存されます。
    端末変更やデータ削除に備えて保存してください。
  </p>
</div>

</section>

<section id="quiz" class="hidden">
<div class="card">
  <h2 id="quizTitle"></h2>
  <p id="counter" class="muted"></p>
  <div class="progress"><div id="quizBar"></div></div>
  <p><span id="category" class="tag"></span></p>
  <h3 id="questionText"></h3>
  <div id="choices"></div>
  <div id="result" class="hidden"></div>
  <div class="row">
    <button onclick="show('home')">ホーム</button>
    <button id="answerBtn" class="primary" onclick="answer()" disabled>
      解答する
    </button>
    <button id="nextBtn" class="primary hidden" onclick="next()">
      次へ
    </button>
  </div>
</div>
</section>

</main>

<a href="admin.html" class="admin-link">管理者</a>

<footer>
  ひらのの栄養教室
  <p>学習・栄養教育を目的としたサイトです。</p>
</footer>

<script>
"use strict";

const STORAGE="hiranoProgressV1";
const QUESTION_URL="questions.json";

const SAMPLE=[
{
 id:"life001",
 type:"life",
 subject:"栄養素",
 question:"非ヘム鉄の吸収を助ける栄養素はどれ？",
 options:["ビタミンC","ビタミンD","ビタミンK"],
 answer:0,
 explanations:[
  "○ ビタミンCは非ヘム鉄の吸収を助けます。",
  "× ビタミンDはカルシウムの吸収などに関係します。",
  "× ビタミンKは血液凝固などに関係します。"
 ],
 explanation:"非ヘム鉄を含む食品と、ビタミンCを含む野菜や果物を組み合わせる工夫が役立ちます。",
 source:"一般向けオリジナル問題"
},
{
 id:"life002",
 type:"life",
 subject:"食品表示",
 question:"食塩相当量1gに相当するナトリウムは約何mg？",
 options:["100mg","400mg","1000mg"],
 answer:1,
 explanations:[
  "× 約100mgではありません。",
  "○ 約393mgで、400mgが最も近い値です。",
  "× ナトリウム1000mgは食塩相当量約2.54gです。"
 ],
 explanation:"食塩相当量(g)＝ナトリウム(mg)×2.54÷1000で換算します。",
 source:"一般向けオリジナル問題"
},
{
 id:"life003",
 type:"life",
 subject:"食品衛生",
 question:"ノロウイルス対策として、汚染のおそれがある二枚貝の中心部を加熱する目安は？",
 options:[
  "50℃で10秒",
  "65℃で30秒",
  "85〜90℃で90秒以上"
 ],
 answer:2,
 explanations:[
  "× 十分な加熱条件ではありません。",
  "× ノロウイルス対策としては不十分です。",
  "○ 中心部85〜90℃で90秒以上が目安です。"
 ],
 explanation:"手洗い、調理器具の洗浄・消毒も重要です。",
 source:"一般向けオリジナル問題"
},
{
 id:"life004",
 type:"life",
 subject:"食品表示",
 question:"『糖類ゼロ』と表示された食品について正しいものは？",
 options:[
  "糖質も必ずゼロ",
  "エネルギーも必ずゼロ",
  "糖質がゼロとは限らない"
 ],
 answer:2,
 explanations:[
  "× 糖類以外の糖質を含む場合があります。",
  "× エネルギーがゼロとは限りません。",
  "○ 糖類と糖質は同じ意味ではありません。"
 ],
 explanation:"『ゼロ』表示は、定められた基準値未満を意味する場合があります。",
 source:"一般向けオリジナル問題"
},
{
 id:"easy001",
 type:"easy",
 subject:"基礎栄養学",
 question:"1gあたり約9kcalのエネルギーを生み出す栄養素は？",
 options:["たんぱく質","脂質","炭水化物"],
 answer:1,
 explanations:[
  "× たんぱく質は一般的に約4kcal/gです。",
  "○ 脂質は約9kcal/gです。",
  "× 利用可能炭水化物は一般的に約4kcal/gです。"
 ],
 explanation:"エネルギー換算係数は栄養学の基本です。",
 source:"国家試験の学習範囲を参考にしたオリジナル問題"
},
{
 id:"easy002",
 type:"easy",
 subject:"人体の構造と機能",
 question:"血糖値を下げる方向に働くホルモンは？",
 options:["インスリン","グルカゴン","アドレナリン"],
 answer:0,
 explanations:[
  "○ インスリンは血糖値を下げる方向に働きます。",
  "× グルカゴンは主に血糖値を上げます。",
  "× アドレナリンは血糖値を上げる方向に働きます。"
 ],
 explanation:"インスリンは膵臓のβ細胞から分泌されます。",
 source:"国家試験の学習範囲を参考にしたオリジナル問題"
}
];

function $(id){return document.getElementById(id)}

function readJSON(key,fallback){
 try{
  return JSON.parse(localStorage.getItem(key)) ?? fallback;
 }catch{
  return fallback;
 }
}

let progress=readJSON(STORAGE,{history:[],due:{}});
if(!Array.isArray(progress.history))progress.history=[];
if(!progress.due || typeof progress.due!=="object")progress.due={};

let questions=[...SAMPLE];
let session=null;

function validQuestion(q){
 return q &&
 typeof q.id==="string" &&
 typeof q.type==="string" &&
 typeof q.subject==="string" &&
 typeof q.question==="string" &&
 Array.isArray(q.options) &&
 q.options.length>=2 &&
 q.options.length<=5 &&
 q.options.every(x=>typeof x==="string") &&
 Number.isInteger(q.answer) &&
 q.answer>=0 &&
 q.answer<q.options.length &&
 Array.isArray(q.explanations) &&
 q.explanations.length===q.options.length &&
 q.explanations.every(x=>typeof x==="string") &&
 typeof q.explanation==="string" &&
 typeof q.source==="string" &&
 (
  q.type!=="exam" ||
  (q.options.length===5 && q.officialChecked===true)
 );
}

async function loadQuestions(){
 try{
  const response=await fetch(QUESTION_URL,{cache:"no-store"});
  if(!response.ok)return;
  const data=await response.json();
  if(!Array.isArray(data))return;

  const map=new Map(SAMPLE.map(q=>[q.id,q]));
  data.filter(validQuestion).forEach(q=>map.set(q.id,q));
  questions=[...map.values()];
 }catch(e){
  console.log("追加問題なし",e);
 }
}

function localDate(date=new Date()){
 const y=date.getFullYear();
 const m=String(date.getMonth()+1).padStart(2,"0");
 const d=String(date.getDate()).padStart(2,"0");
 return `${y}-${m}-${d}`;
}

function addDays(n){
 const d=new Date();
 d.setHours(12,0,0,0);
 d.setDate(d.getDate()+n);
 return localDate(d);
}

function saveProgress(){
 try{
  localStorage.setItem(STORAGE,JSON.stringify(progress));
 }catch{
  alert("記録を保存できませんでした。");
 }
}

function show(page){
 ["home","quiz"].forEach(id=>{
  $(id).classList.toggle("hidden",id!==page);
 });
 if(page==="home")renderHome();
 window.scrollTo(0,0);
}

function renderHome(){
 const h=progress.history;
 const correct=h.filter(x=>x.correct).length;
 const xp=correct*10+(h.length-correct)*3;
 const level=Math.floor(xp/100)+1;

 $("level").textContent=level;
 $("rate").textContent=h.length
  ?Math.round(correct/h.length*100)+"%"
  :"0%";
 $("xpText").textContent=`経験値 ${xp} XP`;
 $("xpBar").style.width=(xp%100)+"%";

 const dates=new Set(h.map(x=>x.date));
 let d=new Date();
 d.setHours(12,0,0,0);
 let streak=0;

 if(!dates.has(localDate(d)))d.setDate(d.getDate()-1);

 while(dates.has(localDate(d))){
  streak++;
  d.setDate(d.getDate()-1);
 }

 $("streak").textContent=streak;

 const due=Object.values(progress.due)
  .filter(x=>x.next<=localDate()).length;

 $("dueText").textContent=`復習予定：${due}問`;
}

function shuffle(arr){
 const result=[...arr];
 for(let i=result.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [result[i],result[j]]=[result[j],result[i]];
 }
 return result;
}

function dailyPool(pool){
 const day=Number(localDate().replaceAll("-",""));
 return [...pool]
  .sort((a,b)=>a.id.localeCompare(b.id))
  .map((q,i)=>({
   q,
   key:((day+i*7919)*2654435761)>>>0
  }))
  .sort((a,b)=>a.key-b.key)
  .slice(0,5)
  .map(x=>x.q);
}

function start(mode){
 let pool=[];
 let title="";
 let ox=false;

 if(mode==="exam"){
  pool=questions.filter(q=>q.type==="exam");
  title="国家試験5択";
 }
 if(mode==="ox"){
  pool=questions.filter(q=>q.type==="exam");
  title="選択肢○×";
  ox=true;
 }
 if(mode==="easy"){
  pool=questions.filter(q=>q.type==="easy");
  title="やさしい国試";
 }
 if(mode==="life"){
  pool=questions.filter(q=>q.type==="life");
  title="暮らしの栄養";
 }
 if(mode==="daily"){
  pool=dailyPool(questions);
  title="今日の5問";
 }
 if(mode==="review"){
  pool=questions.filter(q=>
   Object.entries(progress.due).some(
    ([key,v])=>
     (key===q.id || key.startsWith(q.id+"#")) &&
     v.next<=localDate()
   )
  );
  title="復習モード";
 }

 if(!pool.length){
  alert("現在、このコースに出題できる問題はありません。");
  return;
 }

 if(mode!=="daily")pool=shuffle(pool);

 const items=ox
  ?pool.flatMap(q=>q.options.map((_,i)=>({q,oxIndex:i})))
  :pool.map(q=>({q,oxIndex:-1}));

 session={
  mode,title,items,index:0,
  selected:-1,answered:false,correct:0
 };

 show("quiz");
 renderQuestion();
}

function renderQuestion(){
 const s=session;
 const item=s.items[s.index];
 const q=item.q;
 const isOX=item.oxIndex>=0;

 s.selected=-1;
 s.answered=false;

 $("quizTitle").textContent=s.title;
 $("counter").textContent=`${s.index+1} / ${s.items.length}問`;
 $("quizBar").style.width=
  (s.index/s.items.length*100)+"%";

 $("category").textContent=q.subject;

 $("questionText").textContent=isOX
  ?"次の記述は正しい？\n"+q.options[item.oxIndex]
  :q.question;

 const options=isOX?["○ 正しい","× 誤り"]:q.options;
 const area=$("choices");
 area.replaceChildren();

 options.forEach((text,i)=>{
  const b=document.createElement("button");
  b.className="choice";
  b.textContent=isOX?text:`${i+1}. ${text}`;
  b.onclick=()=>selectChoice(i);
  area.appendChild(b);
 });

 $("result").replaceChildren();
 $("result").classList.add("hidden");
 $("answerBtn").classList.remove("hidden");
 $("answerBtn").disabled=true;
 $("nextBtn").classList.add("hidden");
 window.scrollTo(0,0);
}

function selectChoice(i){
 if(session.answered)return;
 session.selected=i;
 $("answerBtn").disabled=false;

 document.querySelectorAll(".choice").forEach((b,j)=>{
  b.classList.toggle("selected",i===j);
 });
}

function answer(){
 const s=session;
 if(!s || s.answered || s.selected<0)return;

 const item=s.items[s.index];
 const q=item.q;
 const isOX=item.oxIndex>=0;

 const correctIndex=isOX
  ?(q.optionsCorrect
    ?(q.optionsCorrect[item.oxIndex]?0:1)
    :(item.oxIndex===q.answer?0:1))
  :q.answer;

 const ok=s.selected===correctIndex;
 s.answered=true;
 if(ok)s.correct++;

 const key=isOX?q.id+"#"+item.oxIndex:q.id;

 progress.history.push({
  id:key,
  date:localDate(),
  correct:ok,
  mode:s.mode
 });

 const old=progress.due[key]||{step:-1};
 const steps=[1,3,7,30];
 const step=ok
  ?Math.min(old.step+1,3)
  :0;

 progress.due[key]={
  step,
  next:addDays(steps[step])
 };

 saveProgress();

 document.querySelectorAll(".choice").forEach((b,i)=>{
  b.disabled=true;
  b.classList.remove("selected");
  if(i===correctIndex)b.classList.add("correct");
  if(i===s.selected&&!ok)b.classList.add("wrong");
 });

 const result=$("result");
 result.classList.remove("hidden");

 const heading=document.createElement("h3");
 heading.textContent=ok?"正解！":"不正解";
 result.appendChild(heading);

 const box=document.createElement("div");
 box.className="explain";

 let text="";

 if(isOX){
  text=`正答：${correctIndex===0?"○":"×"}\n\n`;
  text+=q.explanations[item.oxIndex];
 }else{
  text=`正答：${q.answer+1}\n\n`;
  q.explanations.forEach((e,i)=>{
   text+=`${i+1}. ${e}\n`;
  });
 }

 text+=`\n補足：${q.explanation}`;
 text+=`\n出典：${q.source}`;

 box.textContent=text;
 result.appendChild(box);

 $("answerBtn").classList.add("hidden");
 $("nextBtn").classList.remove("hidden");
 $("nextBtn").textContent=
  s.index===s.items.length-1?"結果を見る":"次の問題";

 renderHome();
}

function next(){
 if(!session || !session.answered)return;

 session.index++;

 if(session.index>=session.items.length){
  const s=session;
  $("questionText").textContent="チャレンジ終了";
  $("counter").textContent="";
  $("quizBar").style.width="100%";
  $("choices").replaceChildren();
  $("result").replaceChildren();
  $("result").classList.remove("hidden");

  const h=document.createElement("h2");
  h.textContent=`${s.correct} / ${s.items.length}問正解`;
  $("result").appendChild(h);

  const p=document.createElement("p");
  p.textContent="学習記録を保存しました。";
  $("result").appendChild(p);

  $("nextBtn").classList.add("hidden");
  return;
 }

 renderQuestion();
}

function download(blob,name){
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}

function backup(){
 const data={
  version:1,
  progress,
  exportedAt:new Date().toISOString()
 };

 download(
  new Blob([JSON.stringify(data,null,2)],{
   type:"application/json"
  }),
  "hirano-backup-"+localDate()+".json"
 );
}

async function restore(event){
 const file=event.target.files[0];
 if(!file)return;

 try{
  const data=JSON.parse(await file.text());

  if(
   !data.progress ||
   !Array.isArray(data.progress.history) ||
   !data.progress.due ||
   typeof data.progress.due!=="object"
  )throw new Error("形式が不正です");

  if(confirm("現在の学習記録を上書きしますか？")){
   progress=data.progress;
   saveProgress();
   renderHome();
   alert("復元しました");
  }
 }catch(e){
  alert("復元エラー："+e.message);
 }

 event.target.value="";
}

loadQuestions().then(renderHome);
</script>
</body>
</html>

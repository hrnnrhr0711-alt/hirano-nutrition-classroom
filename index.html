[hidden] { display: none !important; }
@media (min-width: 680px) {

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }

</style>

const SITE = {

const PUBLIC_CATEGORIES = [
  ["栄養のきほん", "🍚"],

   choices  : 選択肢の配列
   answers  : 正答の位置。最初の選択肢は 0
   explanation : 独自作成の解説
   source   : 出典説明

   複数正答にも対応：
   answers: [0, 2] → 1番と3番を両方選ぶ問題

   同じ問題を修正する場合、idは変更しないでください。

const QUESTIONS = [
  {
    id: "past-40-017",
    course: "student",

    answers: [3],
    explanation:
      "正答は4です。\nリソソームは膜で囲まれた細胞小器官で、内部に加水分解酵素を含みます。\n核小体、中心体、プロテアソーム、リボソームはいずれも生体膜で囲まれていません。",

  },
  {
    id: "past-40-020",
    course: "student",

      "AMPは、高エネルギーリン酸化合物である。",
      "ATP合成酵素は、ミトコンドリア外膜に存在する。",
      "ATP合成酵素は、細胞内外のCa²⁺濃度勾配により駆動される。",
      "電子伝達系では、二酸化炭素が産生される。",
      "脱共役たんぱく質（UCP）は、ミトコンドリア内膜に存在する。"
    ],
    answers: [4],
    explanation:
      "正答は5です。\n脱共役たんぱく質（UCP）はミトコンドリア内膜に存在し、プロトンの電気化学的勾配をATP合成と切り離して、熱の産生に関与します。\nATP合成酵素も内膜に存在し、主に内膜を隔てたH⁺の電気化学的勾配を利用します。\n電子伝達系では酸素が還元され、水が生じます。",

  {

      "尿管を通って肝臓へ向かう。",
      "吸収されたグルコースはすべて小腸で分解される。"

    answers: [1],
    explanation:
      "グルコースは小腸上皮細胞から血液側へ移動し、主に門脈を通って肝臓へ運ばれます。\n長鎖脂肪酸を材料とする脂質の運搬経路と区別しましょう。",

  {

/* =========================================================
   3. 共通関数と保存処理
   ========================================================= */

const $ = selector => document.querySelector(selector);
const app = $("#app");

const escapeHTML = value => String(value ?? "").replace(
  /[&<>"']/g,
  ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]
);

const byId = new Map(QUESTIONS.map(q => [q.id, q]));
const rate = (a, b) => b ? Math.round(a / b * 100) : 0;

function freshData() {
  return {
    version: SITE.version,
    course: "student",
    records: {},
    bookmarks: [],
    session: null
  };
}

function validSelection(value, q) {
  return Array.isArray(value)
    && value.length <= q.answers.length
    && new Set(value).size === value.length
    && value.every(n =>
      Number.isInteger(n) && n >= 0 && n < q.choices.length
    );
}

function sameAnswers(a, b) {
  return a.length === b.length
    && [...a].sort((x, y) => x - y)
      .every((n, i) => n === [...b].sort((x, y) => x - y)[i]);
}

function validateData(raw) {
  if (!raw || raw.version !== SITE.version) {
    throw new Error("対応していないバックアップです。");
  }

  const clean = freshData();
  clean.course = raw.course === "public" ? "public" : "student";

  if (!raw.records || typeof raw.records !== "object"
      || Array.isArray(raw.records)) {
    throw new Error("学習記録の形式が正しくありません。");
  }

  for (const [id, r] of Object.entries(raw.records)) {
    const q = byId.get(id);
    if (!q) continue;

    if (!r || !Number.isSafeInteger(r.attempts)
        || r.attempts < 1
        || !Number.isSafeInteger(r.correct)
        || r.correct < 0 || r.correct > r.attempts
        || !validSelection(r.selected, q)
        || r.selected.length !== q.answers.length
        || !Number.isFinite(Date.parse(r.updated))) {
      throw new Error("学習記録に不正な値があります。");
    }

    clean.records[id] = {
      attempts: r.attempts,
      correct: r.correct,
      selected: [...r.selected],
      lastCorrect: sameAnswers(r.selected, q.answers),
      updated: r.updated
    };
  }

  clean.bookmarks = Array.isArray(raw.bookmarks)
    ? [...new Set(raw.bookmarks.filter(id => byId.has(id)))]
    : [];

  const s = raw.session;
  if (s !== null && s !== undefined) {
    if (!s || !Array.isArray(s.ids) || !s.ids.length
        || new Set(s.ids).size !== s.ids.length
        || !s.ids.every(id => byId.has(id))
        || !["student", "public"].includes(s.course)
        || !s.ids.every(id => byId.get(id).course === s.course)
        || !Number.isInteger(s.index)
        || s.index < 0 || s.index >= s.ids.length
        || !["practice", "exam"].includes(s.type)
        || typeof s.finished !== "boolean"
        || (s.type === "exam" &&
          (!Number.isFinite(s.deadline) || s.deadline <= 0))
        || !s.answers || typeof s.answers !== "object"
        || Array.isArray(s.answers)
        || !s.logged || typeof s.logged !== "object"
        || Array.isArray(s.logged)) {
      throw new Error("途中の学習データが正しくありません。");
    }

    const answers = {};
    const logged = {};

    for (const id of s.ids) {
      const q = byId.get(id);
      const a = s.answers[id] ?? [];

      if (!validSelection(a, q)) {
        throw new Error("解答データが正しくありません。");
      }

      answers[id] = [...a];

      if (s.logged[id] === true) {
        if (a.length !== q.answers.length) {
          throw new Error("確定済み解答が正しくありません。");
        }
        logged[id] = true;
      }
    }

    clean.session = {
      course: s.course,
      ids: [...s.ids],
      index: s.index,
      type: s.type,
      deadline: s.type === "exam" ? s.deadline : null,
      title: typeof s.title === "string"
        ? s.title.slice(0, 100) : "学習",
      answers,
      logged,
      finished: s.finished
    };
  }

  return clean;
}

function bank() {
  return QUESTIONS.filter(q => q.course === data.course);
}

function categories() {
  return data.course === "student" ? SUBJECTS : PUBLIC_CATEGORIES;
}

function shuffle(items, random = Math.random) {
  const out = [...items];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function japanDate() {
  return new Intl.DateTimeFormat("sv-SE", {
    timeZone: "Asia/Tokyo",
    year: "numeric", month: "2-digit", day: "2-digit"
  }).format(new Date());
}

function dailyQuestions() {
  const seedText = japanDate() + data.course;
  let seed = 2166136261;

  for (const ch of seedText) {
    seed = Math.imul(seed ^ ch.charCodeAt(0), 16777619);
  }

  function random() {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  return shuffle(bank(), random).slice(0, 5);
}

function metrics(list = bank()) {
  const records = list.map(q => data.records[q.id]).filter(Boolean);
  const attempts = records.reduce((sum, r) => sum + r.attempts, 0);
  const correct = records.reduce((sum, r) => sum + r.correct, 0);

  return {
    total: list.length,
    answered: records.length,
    attempts,
    correct,
    accuracy: rate(correct, attempts),
    wrong: records.filter(r => !r.lastCorrect).length,
    bookmarks: list.filter(q => data.bookmarks.includes(q.id)).length
  };
}

  return `

      ${button("表示中の問題をまとめて解く", "start-list", "btn full")}

/* =========================================================
   5. 学習セッション
   ========================================================= */

function startSession(list, title, type = "practice", minutes = 10) {
  if (!list.length) {
    toast("出題できる問題がありません。");
    return;
  }

  if (data.session && !data.session.finished) {
    const accepted = window.confirm(
      "途中の学習を終了して、新しい学習を始めますか？\n"
      + "すでに確定・採点された成績は残ります。"
    );
    if (!accepted) return;
  }

  data.session = {
    course: data.course,
    ids: list.map(q => q.id),
    index: 0,
    type,
    title,
    deadline: type === "exam" ? Date.now() + minutes * 60000 : null,
    answers: {},
    logged: {},
    finished: false
  };

  save();
  page = "quiz";
  render();
}

function currentQuestion() {
  const s = data.session;
  return s ? byId.get(s.ids[s.index]) : null;
}

function recordAnswer(q, selected) {
  const prev = data.records[q.id];
  const ok = sameAnswers(selected, q.answers);

  data.records[q.id] = {
    attempts: (prev?.attempts || 0) + 1,
    correct: (prev?.correct || 0) + (ok ? 1 : 0),
    selected: [...selected],
    lastCorrect: ok,
    updated: new Date().toISOString()
  };
}

function choose(index) {
  const s = data.session;
  const q = currentQuestion();

  if (!s || !q || s.finished || page !== "quiz") return;
  if (!Number.isInteger(index) || index < 0 || index >= q.choices.length) return;
  if (s.type === "practice" && s.logged[q.id]) return;

  let selected = [...(s.answers[q.id] || [])];

  if (q.answers.length === 1) {
    selected = [index];
  } else if (selected.includes(index)) {
    selected = selected.filter(n => n !== index);
  } else {
    if (selected.length >= q.answers.length) {
      toast(`${q.answers.length}つまで選べます。変更するときは選択を解除してください。`);
      return;
    }
    selected.push(index);
  }

  s.answers[q.id] = selected;
  save();
  render(false);
}

function confirmAnswer() {
  const s = data.session;
  const q = currentQuestion();

  if (!s || !q || s.finished || s.type !== "practice") return;
  if (s.logged[q.id]) return;

  const selected = s.answers[q.id] || [];
  if (selected.length !== q.answers.length) return;

  recordAnswer(q, selected);
  s.logged[q.id] = true;
  save();
  render(false);
}

function finishExam(automatic = false) {
  const s = data.session;
  if (!s || s.type !== "exam" || s.finished) return;

  if (!automatic) {
    const unanswered = s.ids.filter(id =>
      (s.answers[id] || []).length !== byId.get(id).answers.length
    ).length;

    if (!window.confirm(
      `提出して採点しますか？\n未回答：${unanswered}問`
    )) return;
  }

  for (const id of s.ids) {
    const q = byId.get(id);
    const selected = s.answers[id] || [];

    if (selected.length === q.answers.length && !s.logged[id]) {
      recordAnswer(q, selected);
      s.logged[id] = true;
    }
  }

  s.finished = true;
  data.course = s.course;
  save();
  page = "result";
  render();

  if (automatic) toast("制限時間になったため、自動提出しました。");
}

function updateTimer() {
  const s = data.session;

  if (!s || s.finished || s.type !== "exam") return;

  const remaining = s.deadline - Date.now();

  if (remaining <= 0) {
    finishExam(true);
    return;
  }

  const timer = $("#timer");
  if (!timer) return;

  const seconds = Math.ceil(remaining / 1000);
  const minutes = Math.floor(seconds / 60);
  timer.textContent = `⏱ 残り ${minutes}:${String(seconds % 60).padStart(2, "0")}`;
}

function visibleList() {
  let list = bank();

  if (listMode === "wrong") {
    list = list.filter(q => data.records[q.id]
      && !data.records[q.id].lastCorrect);
  }
  if (listMode === "bookmarks") {
    list = list.filter(q => data.bookmarks.includes(q.id));
  }
  if (listMode === "unanswered") {
    list = list.filter(q => !data.records[q.id]);
  }

  const term = searchText.trim().toLocaleLowerCase("ja");
  return term ? list.filter(q =>
    [q.text, q.subject, questionLabel(q), ...q.choices]
      .join(" ").toLocaleLowerCase("ja").includes(term)
  ) : list;
}

/* =========================================================
   6. バックアップ
   ========================================================= */

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {
    type: "application/json"
  });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = `hirano-learning-${japanDate()}.json`;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast("バックアップの保存を開始しました。");
}

$("#restoreFile").addEventListener("change", async event => {
  const file = event.target.files?.[0];
  if (!file) return;

  try {
    if (file.size > 5 * 1024 * 1024) {
      throw new Error("ファイルが大きすぎます。");
    }

    const imported = validateData(JSON.parse(await file.text()));

    if (!window.confirm(
      "バックアップを復元しますか？\n現在の両コースの学習記録を置き換えます。"
    )) return;

    data = imported;
    save();
    page = "home";
    render();
    toast("学習記録を復元しました。");
  } catch (error) {
    toast("復元できませんでした。対応するバックアップJSONを確認してください。");
  } finally {
    event.target.value = "";
  }
});

/* =========================================================
   7. 操作イベント
   ========================================================= */

document.addEventListener("click", event => {
  const courseButton = event.target.closest("[data-course]");
  if (courseButton) {
    data.course = courseButton.dataset.course === "public"
      ? "public" : "student";
    save();
    page = "home";
    render();
    return;
  }

  const pageButton = event.target.closest("[data-page]");
  if (pageButton) {
    page = pageButton.dataset.page;
    render();
    return;
  }

  const target = event.target.closest("[data-action]");
  if (!target || target.disabled) return;

  const action = target.dataset.action;
  const value = target.dataset.value;
  const s = data.session;

  if (["home", "learn", "subjects", "years", "exam-setup"].includes(action)) {
    page = action;
    render();
    return;
  }

  if (["wrong", "bookmarks", "unanswered", "search"].includes(action)) {
    listMode = action;
    searchText = "";
    page = "list";
    render();
    return;
  }

  switch (action) {
    case "subject": {
      const category = categories()[Number(value)];
      if (!category) return;
      startSession(
        bank().filter(q => q.subject === category[0]),
        category[0]
      );
      break;
    }

    case "year": {
      const year = Number(value);
      startSession(
        bank().filter(q => q.kind === "past" && q.year === year),
        `${year}年の過去問`
      );
      break;
    }

    case "random":
      startSession(shuffle(bank()).slice(0, 10), "ランダム学習");
      break;

    case "daily":
      startSession(dailyQuestions(), `${japanDate()}・今日の問題`);
      break;

    case "start-list":
      startSession(visibleList(), {
        wrong: "間違えた問題の復習",
        bookmarks: "ブックマーク学習",
        unanswered: "未回答の問題",
        search: "検索した問題"
      }[listMode] || "問題学習");
      break;

    case "single": {
      const q = byId.get(value);
      if (q && q.course === data.course) {
        startSession([q], questionLabel(q));
      }
      break;
    }

    case "start-exam": {
      const count = Number($("#examCount").value);
      const minutes = Number($("#examMinutes").value);
      if (!Number.isInteger(count) || count < 1 || count > bank().length) return;
      if (![5, 10, 20, 30].includes(minutes)) return;
      startSession(
        shuffle(bank()).slice(0, count),
        `時間制限付き練習・${count}問`,
        "exam",
        minutes
      );
      break;
    }

    case "resume":
      if (s && !s.finished) {
        data.course = s.course;
        save();
        page = "quiz";
        render();
      }
      break;

    case "choose":
      choose(Number(value));
      break;

    case "confirm-answer":
      confirmAnswer();
      break;

    case "bookmark": {
      const q = currentQuestion();
      if (!q || !s || s.finished) return;
      const index = data.bookmarks.indexOf(q.id);
      if (index >= 0) data.bookmarks.splice(index, 1);
      else data.bookmarks.push(q.id);
      save();
      render(false);
      toast(index >= 0 ? "ブックマークを解除しました。" : "ブックマークしました。");
      break;
    }

    case "next":
      if (!s || s.finished || s.type !== "practice") return;
      if (!s.logged[s.ids[s.index]]) return;

      if (s.index === s.ids.length - 1) {
        s.finished = true;
        page = "result";
      } else {
        s.index++;
      }
      save();
      render();
      break;

    case "previous":
    case "next-exam":
    case "jump":
      if (!s || s.finished || s.type !== "exam") return;
      {
        const nextIndex = action === "jump" ? Number(value)
          : s.index + (action === "previous" ? -1 : 1);

        if (!Number.isInteger(nextIndex)
            || nextIndex < 0 || nextIndex >= s.ids.length) return;

        s.index = nextIndex;
        save();
        render();
      }
      break;

    case "submit-exam":
      finishExam(false);
      break;

    case "pause":
      save();
      page = "home";
      render();
      break;

    case "retry":
      if (!s || !s.finished) return;
      startSession(
        s.ids.map(id => byId.get(id)),
        s.title,
        s.type,
        10
      );
      if (s.type === "exam") {
        toast("再挑戦の制限時間は10分です。");
      }
      break;

    case "export":
      exportData();
      break;

    case "restore":
      $("#restoreFile").click();
      break;

    case "reset":
      if (window.confirm(
        "両コースの学習成績・ブックマーク・途中の学習をすべて削除しますか？\n"
        + "必要なら先にバックアップしてください。"
      )) {
        const course = data.course;
        data = freshData();
        data.course = course;
        save();
        page = "home";
        render();
        toast("学習記録を削除しました。");
      }
      break;
  }
});

document.addEventListener("input", event => {
  if (event.target.id !== "questionSearch") return;

  searchText = event.target.value;
  const cursor = event.target.selectionStart;
  render(false);

  const input = $("#questionSearch");
  input.focus({ preventScroll: true });

  try {
    input.setSelectionRange(cursor, cursor);
  } catch (error) {
    // 検索欄の選択範囲指定に対応しないブラウザでは省略します。
  }
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) updateTimer();
});

window.addEventListener("pageshow", updateTimer);

setInterval(updateTimer, 1000);

/* 問題データの基本チェック */
for (const q of QUESTIONS) {
  if (!q.id || !["student", "public"].includes(q.course)
      || !["past", "original"].includes(q.kind)
      || !Array.isArray(q.choices) || q.choices.length < 2
      || !Array.isArray(q.answers) || !q.answers.length
      || !validSelection(q.answers, q)) {
    throw new Error("問題データの形式が正しくありません：" + q.id);
  }
}
if (byId.size !== QUESTIONS.length) {
  throw new Error("問題IDが重複しています。");
}

render();
</script>
</body>

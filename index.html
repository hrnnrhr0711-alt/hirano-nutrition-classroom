<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理栄養士国家試験対策アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col items-center justify-start">

    <!-- Mobile Frame Wrapper for Web & Mobile hybrid preview -->
    <div id="app-container" class="w-full max-w-md bg-white min-h-screen shadow-2xl flex flex-col relative pb-20">
        
        <!-- Top Header Navigation -->
        <header id="header" class="bg-[#1b7a43] text-white px-4 py-3.5 flex items-center justify-between sticky top-0 z-50 shadow-md">
            <div class="flex items-center space-x-2">
                <button id="back-btn" onclick="goHome()" class="hidden text-white text-base p-1 hover:bg-emerald-800 rounded-lg transition"><i class="fa-solid fa-chevron-left"></i></button>
                <h1 id="header-title" class="font-bold text-base tracking-wide">管理栄養士 試験対策</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleAiMode()" class="text-xs bg-emerald-800/80 hover:bg-emerald-900 px-2.5 py-1 rounded-full text-emerald-100 transition flex items-center space-x-1">
                    <i class="fa-solid fa-bolt text-amber-300"></i>
                    <span>AI連動</span>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Dynamic Views injected via JavaScript -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2.5 px-6 flex justify-around items-center z-40 shadow-lg">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-[#1b7a43] transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium mt-1">ホーム</span>
            </button>
            <button onclick="switchTab('study')" id="nav-study" class="flex flex-col items-center text-slate-400 hover:text-[#1b7a43] transition">
                <i class="fa-solid fa-book-open text-lg"></i>
                <span class="text-[10px] font-medium mt-1">学習</span>
            </button>
            <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center text-slate-400 hover:text-[#1b7a43] transition">
                <i class="fa-solid fa-chart-simple text-lg"></i>
                <span class="text-[10px] font-medium mt-1">成績</span>
            </button>
            <button onclick="switchTab('mypage')" id="nav-mypage" class="flex flex-col items-center text-slate-400 hover:text-[#1b7a43] transition">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] font-medium mt-1">マイページ</span>
            </button>
        </nav>
    </div>

    <!-- Message Modal for Alerts / Info -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
            <div id="modal-icon" class="text-emerald-600 text-4xl"><i class="fa-solid fa-circle-check"></i></div>
            <h3 id="modal-title" class="font-bold text-lg text-slate-800">通知</h3>
            <p id="modal-text" class="text-sm text-slate-600">メッセージが入ります。</p>
            <button onclick="closeModal()" class="w-full bg-[#1b7a43] text-white py-2.5 rounded-xl font-bold shadow-md hover:bg-emerald-800 transition">閉じる</button>
        </div>
    </div>

    <!-- Application Logic Script -->

            },
            {
                id: 4,
                year: "第39回 (2025年3月実施)",
                subject: "食べ物と健康",
                question: "食品の加工と保蔵に関する記述である。最も適当なものを1つ選べ。",
                options: [
                    "フリーズドライは、常圧下での加熱乾燥法である。",

                    "メタボリックシンドロームの診断では、腹囲が必須項目である。",

            {
                id: 6,
                year: "第37回 (2023年3月実施)",

                options: [
                    "調査の法的根拠は、健康増進法である。",
                    "対象は、全国の20歳以上の者である。",
                    "身体状況調査における身長測定は、被測定者の意思にかかわらず強制される。",
                    "栄養摂取状況調査は、通年の1日について実施される。",
                    "生活習慣に関する調査項目には、喫煙や飲酒が含まれない。"
                ],
                answer: 1,
                explanation: "国民健康・栄養調査は健康増進法を根拠として実施されています。"
            }
        ];

        // 8 Core Subjects
        const subjects = [
            { name: "社会・環境と健康", icon: "fa-globe", count: 80 },
            { name: "人体の構造と機能及び疾病の成り立ち", icon: "fa-heart-pulse", count: 140 },
            { name: "食べ物と健康", icon: "fa-apple-whole", count: 130 },
            { name: "基礎栄養学", icon: "fa-dna", count: 70 },
            { name: "応用栄養学", icon: "fa-baby", count: 80 },
            { name: "栄養教育論", icon: "fa-book", count: 70 },
            { name: "臨床栄養学", icon: "fa-hospital", count: 140 },
            { name: "公衆栄養学", icon: "fa-chart-pie", count: 80 }
        ];

        // Years 1 to 40 generator
        const yearsList = Array.from({length: 40}, (_, i) => `第${40 - i}回 (${2026 - i}年3月)`);

        window.onload = function() {
            render();
        };

        function switchTab(tab) {
            state.currentTab = tab;
            state.currentView = tab === 'home' ? 'home' : (tab === 'study' ? 'study_list' : (tab === 'stats' ? 'stats' : 'mypage'));
            render();
        }

        function goHome() {
            state.currentView = 'home';
            state.currentTab = 'home';
            render();
        }

        function render() {
            const main = document.getElementById('main-content');
            const backBtn = document.getElementById('back-btn');
            const headerTitle = document.getElementById('header-title');

            // Bottom Navigation active styling
            ['home', 'study', 'stats', 'mypage'].forEach(t => {
                const el = document.getElementById(`nav-${t}`);
                if (t === state.currentTab) {
                    el.className = "flex flex-col items-center text-[#1b7a43] transition font-bold";
                } else {
                    el.className = "flex flex-col items-center text-slate-400 hover:text-[#1b7a43] transition";
                }
            });

            if (state.currentView === 'home') {
                backBtn.classList.add('hidden');
                headerTitle.innerText = "管理栄養士 試験対策";
                main.innerHTML = renderHomeView();
            } else if (state.currentView === 'study_list') {
                backBtn.classList.remove('hidden');
                headerTitle.innerText = "学習モード選択";
                main.innerHTML = renderStudyListView();
            } else if (state.currentView === 'sub_menu') {
                backBtn.classList.remove('hidden');
                headerTitle.innerText = state.selectedCategoryTitle;
                main.innerHTML = renderSubMenuView();
            } else if (state.currentView === 'quiz') {
                backBtn.classList.remove('hidden');
                headerTitle.innerText = "問題演習";
                main.innerHTML = renderQuizView();
            } else if (state.currentView === 'stats') {
                backBtn.classList.add('hidden');
                headerTitle.innerText = "学習統計・成績";
                main.innerHTML = renderStatsView();
            } else if (state.currentView === 'mypage') {
                backBtn.classList.add('hidden');
                headerTitle.innerText = "マイページ";
                main.innerHTML = renderMypageView();
            }
        }

        // View Renderers
        function renderHomeView() {
            return `
                <!-- User Status Banner -->
                <div class="bg-gradient-to-r from-emerald-600 to-[#1b7a43] text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="relative z-10">
                        <span class="bg-emerald-500/55 text-xs px-2.5 py-1 rounded-full font-medium">国家資格 / 年1回 (3月)</span>
                        <h2 class="text-xl font-bold mt-2">第41回 管理栄養士国家試験</h2>
                        <p class="text-xs text-emerald-100 mt-1">次回試験まであと約4ヶ月！毎日コツコツ学習しましょう。</p>
                    </div>
                    <i class="fa-solid fa-graduation-cap absolute -right-4 -bottom-6 text-emerald-800/25 text-9xl"></i>
                </div>

                <!-- General User: Today's 5 Questions (AI Random) -->
                <div onclick="startMode('todays5')" class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer hover:bg-emerald-100 transition group">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-emerald-600 text-white rounded-xl flex items-center justify-center text-xl shadow-md group-hover:scale-105 transition">
                            <i class="fa-solid fa-calendar-day"></i>
                        </div>
                        <div>
                            <span class="text-xs text-emerald-700 font-bold bg-emerald-200/70 px-2 py-0.5 rounded">一般向け</span>
                            <h3 class="font-bold text-slate-800 text-sm mt-0.5">今日の5問 (AIランダム)</h3>
                            <p class="text-xs text-slate-500">サクッと5問だけ解いて基礎力アップ</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-emerald-600"></i>
                </div>

                <!-- Registered Dietitian AI Review Mode -->
                <div onclick="startMode('ai_review')" class="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer hover:bg-indigo-100 transition group">

                        <div class="w-12 h-12 bg-indigo-600 text-white rounded-xl flex items-center justify-center text-xl shadow-md group-hover:scale-105 transition">

                        </div>
                        <div>
                            <span class="text-xs text-indigo-700 font-bold bg-indigo-200/70 px-2 py-0.5 rounded">管理栄養士向け</span>

                            <p class="text-xs text-slate-500">実務・キャリアに活かす高度実践問題</p>
                        </div>
                    </div>

                </div>

                <!-- Quick Stats Mini Card -->

                    <div class="border-r border-slate-100">
                        <span class="text-xs text-slate-400">連続学習</span>
                        <p class="font-bold text-lg text-emerald-600">${state.stats.streak} <span class="text-xs">日</span></p>
                    </div>
                    <div class="border-r border-slate-100">
                        <span class="text-xs text-slate-400">回答済み</span>
                        <p class="font-bold text-lg text-slate-800">${state.stats.totalAnswered} <span class="text-xs">問</span></p>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400">正答率</span>
                        <p class="font-bold text-lg text-slate-800">${state.stats.totalAnswered > 0 ? Math.round((state.stats.totalCorrect / state.stats.totalAnswered)*100) : 0}%</p>
                    </div>
                </div>

                <!-- Student Learning Modes Grid (5+ Student Modes) -->
                <div>
                    <h3 class="font-bold text-sm text-slate-700 mb-3 px-1"><i class="fa-solid fa-layer-group text-emerald-600 mr-1.5"></i> 学生向け学習モード</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div onclick="openSubMenu('year')" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:border-emerald-500 cursor-pointer transition flex flex-col justify-between">
                            <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-lg mb-2"><i class="fa-solid fa-calendar-days"></i></div>
                            <div>
                                <h4 class="font-bold text-sm">年度別過去問</h4>
                                <p class="text-[11px] text-slate-400 mt-0.5">第1〜40回 (全年度・削除問題除外)</p>
                            </div>

                        <div onclick="openSubMenu('subject')" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:border-emerald-500 cursor-pointer transition flex flex-col justify-between">

                            <div>

                            </div>
                        </div>
                        <div onclick="startMode('random')" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:border-emerald-500 cursor-pointer transition flex flex-col justify-between">
                            <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-lg mb-2"><i class="fa-solid fa-shuffle"></i></div>

                            <div>
                                <h4 class="font-bold text-sm">間違えた問題</h4>
                                <p class="text-[11px] text-slate-400 mt-0.5">苦手を確実に克服</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudyListView() {
            return `
                <div class="space-y-3">

                        <div class="flex items-center space-x-3">
                            <div class="text-2xl"><i class="fa-solid fa-stopwatch"></i></div>
                            <div>
                                <h4 class="font-bold">本番試験モード（模試）</h4>

                    </div>

                    <div onclick="openSubMenu('year')" class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm cursor-pointer hover:border-emerald-500 transition flex items-center justify-between">

                            <div>
                                <h4 class="font-bold text-sm">年度別から選ぶ (第1〜40回)</h4>

                    </div>

                    <div onclick="openSubMenu('subject')" class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm cursor-pointer hover:border-emerald-500 transition flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-layer-group"></i></div>
                            <div>
                                <h4 class="font-bold text-sm">分野・科目別から選ぶ</h4>

                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-400"></i>
                    </div>

                    <div onclick="startMode('random')" class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm cursor-pointer hover:border-emerald-500 transition flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-shuffle"></i></div>
                            <div>
                                <h4 class="font-bold text-sm">ランダム学習</h4>
                                <p class="text-xs text-slate-400">全科目シャッフル出題</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-400"></i>
                    </div>

                    <div onclick="startMode('wrong')" class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm cursor-pointer hover:border-emerald-500 transition flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-xmark"></i></div>
                            <div>
                                <h4 class="font-bold text-sm">間違えた問題</h4>
                                <p class="text-xs text-slate-400">過去に不正解だった問題を復習</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-400"></i>
                    </div>
                </div>
            `;
        }

        function openSubMenu(type) {
            state.currentView = 'sub_menu';
            state.subType = type;
            state.selectedCategoryTitle = type === 'year' ? '年度別一覧 (第1〜40回)' : '科目別一覧';
            render();
        }

        function renderSubMenuView() {
            if (state.subType === 'year') {
                return `
                    <div class="space-y-2">
                        <p class="text-xs text-slate-500 px-1">受験する年度を選択してください（全員正解・不適切問題等は除外済み）</p>
                        ${yearsList.map(y => `
                            <div onclick="startMode('year_selected', '${y}')" class="bg-white border border-slate-200 p-3.5 rounded-xl shadow-sm hover:border-emerald-500 cursor-pointer transition flex items-center justify-between">
                                <span class="font-bold text-sm text-slate-800">${y} 過去問</span>
                                <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg">200問 <i class="fa-solid fa-chevron-right ml-1"></i></span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                return `
                    <div class="space-y-2">
                        <p class="text-xs text-slate-500 px-1">学習したい科目を選択してください</p>
                        ${subjects.map(s => `
                            <div onclick="startMode('subject_selected', '${s.name}')" class="bg-white border border-slate-200 p-3.5 rounded-xl shadow-sm hover:border-emerald-500 cursor-pointer transition flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-9 h-9 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center text-sm"><i class="fa-solid ${s.icon}"></i></div>
                                    <div>
                                        <h4 class="font-bold text-sm text-slate-800">${s.name}</h4>
                                        <p class="text-[11px] text-slate-400">${s.count}問収録</p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-chevron-right text-slate-400 text-sm"></i>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        function startMode(mode, param) {
            state.studyMode = mode;
            if (mode === 'todays5' || mode === 'random' || mode === 'ai_review') {
                state.questions = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, 5);
            } else if (mode === 'subject_selected') {
                state.questions = questionBank.filter(q => q.subject === param);
                if (state.questions.length === 0) {
                    state.questions = [questionBank[0]]; // fallback demo
                }
            } else if (mode === 'wrong') {
                state.questions = questionBank.filter(q => state.wrongQuestions[q.id]);
                if (state.questions.length === 0) {
                    showAlert("通知", "現在間違えた問題はありません！お見事です。");
                    return;
                }
            } else {
                // year_selected or exam or default
                state.questions = [...questionBank];
            }
            state.currentIndex = 0;
            state.userAnswers = {};
            state.currentView = 'quiz';
            render();
        }

        function renderQuizView() {
            const q = state.questions[state.currentIndex];
            if (!q) {
                return `
                    <div class="text-center py-12 space-y-4">
                        <div class="text-emerald-600 text-5xl"><i class="fa-solid fa-circle-check"></i></div>
                        <h3 class="font-bold text-lg">お疲れ様でした！</h3>
                        <p class="text-xs text-slate-500">このセッションの問題をすべてクリアしました。</p>
                        <button onclick="goHome()" class="bg-[#1b7a43] text-white px-6 py-2.5 rounded-xl font-bold shadow-md hover:bg-emerald-800 transition">ホームに戻る</button>
                    </div>
                `;
            }

            const answered = state.userAnswers[q.id] !== undefined;
            const selectedOpt = state.userAnswers[q.id];

            return `
                <!-- Quiz Progress Bar -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs text-slate-500 font-medium">
                        <span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">${q.subject}</span>
                        <span>問題 ${state.currentIndex + 1} / ${state.questions.length}</span>
                    </div>
                    <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                        <div class="bg-emerald-600 h-full transition-all duration-300" style="width: ${((state.currentIndex + 1) / state.questions.length) * 100}%"></div>
                    </div>
                </div>

                <!-- Question Card -->
                <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm space-y-3">
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span class="font-semibold text-emerald-700">${q.year}</span>
                        <button onclick="toggleBookmark(${q.id})" class="text-lg ${state.bookmarks[q.id] ? 'text-amber-500' : 'text-slate-300'}"><i class="fa-solid fa-star"></i></button>
                    </div>
                    <h3 class="font-bold text-sm text-slate-900 leading-relaxed"><span class="text-emerald-600 font-black mr-1">Q.</span>${q.question}</h3>
                </div>

                <!-- Options List -->
                <div class="space-y-2">
                    ${q.options.map((opt, idx) => {
                        const optNum = idx + 1;
                        let btnStyle = "bg-white border-slate-200 text-slate-700 hover:border-emerald-500";
                        if (answered) {
                            if (optNum === q.answer) {
                                btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-bold";
                            } else if (selectedOpt === optNum) {
                                btnStyle = "bg-rose-50 border-rose-500 text-rose-900";
                            } else {
                                btnStyle = "bg-white border-slate-100 text-slate-400 opacity-60";
                            }
                        }
                        return `
                            <button onclick="selectOption(${q.id}, ${optNum})" ${answered ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-xl border ${btnStyle} shadow-sm transition flex items-start space-x-3 text-xs leading-normal">
                                <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-600 font-bold flex items-center justify-center shrink-0 text-xs">${optNum}</span>
                                <span class="flex-1 mt-0.5">${opt}</span>
                                ${answered && optNum === q.answer ? '<i class="fa-solid fa-circle-check text-emerald-600 text-base mt-0.5"></i>' : ''}
                                ${answered && selectedOpt === optNum && optNum !== q.answer ? '<i class="fa-solid fa-circle-xmark text-rose-500 text-base mt-0.5"></i>' : ''}
                            </button>
                        `;
                    }).join('')}
                </div>

                <!-- Explanation Area -->
                ${answered ? `
                    <div class="bg-amber-50/90 border border-amber-200 p-4 rounded-2xl space-y-2 animate-fade-in">
                        <div class="flex items-center space-x-2 text-amber-800 font-bold text-xs">
                            <i class="fa-solid fa-lightbulb text-amber-600"></i>
                            <span>解説</span>
                        </div>
                        <p class="text-xs text-slate-700 leading-relaxed">${q.explanation}</p>
                    </div>

                    <div class="pt-2">
                        <button onclick="nextQuestion()" class="w-full bg-[#1b7a43] text-white py-3 rounded-xl font-bold shadow-md hover:bg-emerald-800 transition flex items-center justify-center space-x-2 text-sm">
                            <span>次の問題へ</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                ` : ''}
            `;
        }

        function selectOption(qId, optNum) {
            const q = state.questions.find(item => item.id === qId);
            state.userAnswers[qId] = optNum;
            state.stats.totalAnswered++;
            if (optNum === q.answer) {
                state.stats.totalCorrect++;
            } else {
                state.wrongQuestions[qId] = true;
            }
            render();
        }

        function nextQuestion() {
            state.currentIndex++;
            render();
        }

        function toggleBookmark(qId) {
            state.bookmarks[qId] = !state.bookmarks[qId];
            render();
        }

        function renderStatsView() {
            const accuracy = state.stats.totalAnswered > 0 ? Math.round((state.stats.totalCorrect / state.stats.totalAnswered)*100) : 0;
            return `
                <div class="space-y-4">
                    <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-sm text-slate-800 mb-3"><i class="fa-solid fa-chart-pie text-emerald-600 mr-1.5"></i> 全体学習統計</h3>
                        <div class="grid grid-cols-4 gap-2 text-center">
                            <div class="bg-slate-50 p-2 rounded-xl">
                                <span class="text-[10px] text-slate-400">回答済み</span>
                                <p class="font-bold text-sm text-slate-800">${state.stats.totalAnswered}</p>
                            </div>
                            <div class="bg-slate-50 p-2 rounded-xl">
                                <span class="text-[10px] text-slate-400">正解数</span>
                                <p class="font-bold text-sm text-emerald-600">${state.stats.totalCorrect}</p>
                            </div>
                            <div class="bg-slate-50 p-2 rounded-xl">
                                <span class="text-[10px] text-slate-400">正答率</span>
                                <p class="font-bold text-sm text-slate-800">${accuracy}%</p>
                            </div>
                            <div class="bg-slate-50 p-2 rounded-xl">
                                <span class="text-[10px] text-slate-400">ブックマーク</span>
                                <p class="font-bold text-sm text-amber-500">${Object.values(state.bookmarks).filter(Boolean).length}</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm space-y-3">
                        <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-list-check text-emerald-600 mr-1.5"></i> 科目別正答率</h3>
                        <div class="space-y-3">
                            ${subjects.map(s => `
                                <div>
                                    <div class="flex justify-between text-xs mb-1">
                                        <span class="font-medium text-slate-700">${s.name}</span>
                                        <span class="text-slate-400">0 / ${s.count}問 (-%)</span>
                                    </div>
                                    <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                        <div class="bg-emerald-600 h-full" style="width: 0%"></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMypageView() {
            return `
                <div class="space-y-4">
                    <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center space-x-4">
                        <div class="w-14 h-14 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center text-2xl font-bold">管</div>
                        <div>
                            <h3 class="font-bold text-base text-slate-800">管理栄養士 卵さん</h3>
                            <p class="text-xs text-slate-400">第41回国家試験受験予定 (学生・一般切替可能)</p>
                        </div>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm divide-y divide-slate-100">
                        <div onclick="showAlert('お知らせ', '第1回〜第40回過去問および解説データの同期が完了しました。')" class="p-3.5 flex items-center justify-between text-xs cursor-pointer hover:bg-slate-50">
                            <span class="font-medium text-slate-700"><i class="fa-solid fa-cloud-arrow-down text-emerald-600 mr-2"></i> 問題データの同期・アップデート</span>
                            <i class="fa-solid fa-chevron-right text-slate-300"></i>
                        </div>
                        <div onclick="showAlert('AI機能', 'AIによる弱点分析エンジンおよび日替わり5問自動算出機能は正常に稼働しています。')" class="p-3.5 flex items-center justify-between text-xs cursor-pointer hover:bg-slate-50">
                            <span class="font-medium text-slate-700"><i class="fa-solid fa-brain text-emerald-600 mr-2"></i> AI弱点分析・復習問題設定</span>
                            <i class="fa-solid fa-chevron-right text-slate-300"></i>
                        </div>
                        <div onclick="showAlert('GitHubガイド', 'このファイルをindex.htmlという名前でGitHubリポジトリにプッシュし、GitHub Pagesを有効化するだけで公開できます。')" class="p-3.5 flex items-center justify-between text-xs cursor-pointer hover:bg-slate-50">
                            <span class="font-medium text-slate-700"><i class="fa-brands fa-github text-slate-800 mr-2"></i> GitHub Pages 公開手順</span>
                            <i class="fa-solid fa-chevron-right text-slate-300"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        function showAlert(title, text) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function toggleAiMode() {
            showAlert("AI連動モード", "現役管理栄養士向けAIレコメンド機能および一般向け「今日の5問」自動出題エンジンがアクティブになりました。");
        }
    </script>
</body>
</html>

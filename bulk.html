
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一括問題管理｜ひらのの栄養教室</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f8f7;color:#203a36;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
header{background:#116e67;color:white;padding:18px}
main{max-width:900px;margin:auto;padding:14px}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 8px #0001}
button,input,select,textarea{font:inherit;padding:10px;border:1px solid #c7d7d0;border-radius:8px;max-width:100%}
button{background:#116e67;color:white;cursor:pointer}
button.secondary{background:white;color:#116e67}
textarea{width:100%;min-height:80px}
label{display:block;margin:12px 0 4px;font-weight:600}
input[type=text],input[type=number],input[type=password],select{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.muted{color:#607a70}
.hidden{display:none}
.item{padding:12px;border:1px solid #d9e5df;border-radius:10px;margin:9px 0}
.tag{display:inline-block;border-radius:30px;padding:4px 8px;background:#eaf5f0;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:#eaf5f0;text-align:center;border-radius:9px;padding:10px}
.stat b{display:block;font-size:22px}
a{color:#116e67}
@media(max-width:600px){
.grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header>
<b>ひらのの栄養教室</b>
<div>第40回・200問 一括登録／校閲管理</div>
</header>

<main>
<section class="card" id="login">
<h2>管理者ログイン</h2>
<form id="loginForm">
<input id="pass" type="password" inputmode="numeric" placeholder="パスワード" required>
<p><button>ログイン</button></p>
</form>
</section>

<section id="app" class="hidden">

<div class="card">
<div class="row">
<a href="admin.html">従来の管理画面へ</a>
<a href="index.html">一般公開画面へ</a>
<button class="secondary" onclick="logout()">ログアウト</button>
</div>
<p class="muted">
編集データはこの端末内に保存されます。
作業用JSONを定期的にバックアップしてください。
</p>
</div>

<div class="card">
<h2>進捗</h2>
<div class="grid" id="stats"></div>
<p class="muted" id="message"></p>
</div>

<div class="card">
<h2>一括取り込み・書き出し</h2>
<p>200問分のJSONデータをまとめて読み込めます。</p>
<input id="file" type="file" accept=".json,application/json">
<div class="row" style="margin-top:10px">
<button onclick="importFile()">JSON一括取込</button>
<button class="secondary" onclick="exportAll()">作業用全件バックアップ</button>
<button onclick="exportPublished()">公開用 questions.json</button>
</div>
<p class="muted">
公式PDFの自動抽出はこの画面では行いません。
公式資料との照合・解説の校閲は別途実施します。
</p>
</div>

<div class="card">
<h2>問題一覧</h2>
<div class="row">
<select id="filter" onchange="render()">
<option value="all">全ステータス</option>
<option value="draft">未確認</option>
<option value="review">校閲中</option>
<option value="figure">図表待ち</option>
<option value="ready">公開可能</option>
</select>
<input id="search" type="text" placeholder="問番号・科目・キーワード" oninput="render()">
</div>
<div id="list"></div>
</div>

<div class="card" id="editor">
<h2>問題を編集</h2>

<label>問番号（1〜200）</label>
<input id="number" type="number" min="1" max="200">

<label>科目</label>
<input id="subject" type="text">

<label>問題の題名</label>
<input id="title" type="text">

<label>設問文</label>
<textarea id="question"></textarea>

<div id="optionInputs"></div>

<label>公式正答の選択肢番号（1〜5）</label>
<input id="answer" type="number" min="1" max="5">

<label>補足解説</label>
<textarea id="explanation"></textarea>

<label>出典</label>
<input id="source" type="text" value="厚生労働省 第40回管理栄養士国家試験">

<label>公開状態</label>
<select id="status">
<option value="draft">未確認</option>
<option value="review">校閲中</option>
<option value="figure">図表待ち</option>
<option value="ready">公開可能</option>
</select>

<label>
<input id="official" type="checkbox">
公式問題・正答を照合済み
</label>

<label>
<input id="checked" type="checkbox">
5肢の解説・転載条件を校閲済み
</label>

<label>
<input id="needsFigure" type="checkbox">
解答に図表が必要
</label>

<label>自作図のパス（必要な場合）</label>
<input id="figurePath" type="text" placeholder="images/questions/40-001.webp">

<div class="row" style="margin-top:14px">
<button onclick="saveItem()">変更を保存</button>
<button class="secondary" onclick="newItem()">指定した問番号を開く</button>
</div>
<p class="muted" id="editInfo"></p>
</div>

</section>
</main>

<script>
"use strict";

const KEY="hirano-bulk-v1";
const PASS="0907";

let records=load();
let current=1;

function $(id){
  return document.getElementById(id);
}

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    return x&&typeof x==="object"&&!Array.isArray(x)?x:{};
  }catch{
    return {};
  }
}

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(records));
  }catch{
    alert("保存できません。作業用JSONを出力してください。");
  }
}

function base(n){
  return {
    id:`40-${String(n).padStart(3,"0")}`,
    type:"exam",
    examNumber:40,
    questionNumber:n,
    subject:"",
    title:"",
    question:"",
    options:Array.from({length:5},()=>({
      text:"",
      explanation:""
    })),
    answer:1,
    explanation:"",
    source:"厚生労働省 第40回管理栄養士国家試験",
    officialChecked:false,
    verified:false,
    reviewStatus:"draft",
    needsFigure:false,
    figurePath:""
  };
}

function get(n){
  return records[n]||base(n);
}

function valid(q){
  return q &&
    Number.isInteger(q.questionNumber) &&
    q.questionNumber>=1 &&
    q.questionNumber<=200 &&
    q.examNumber===40 &&
    Array.isArray(q.options) &&
    q.options.length===5;
}

function status(q){
  return q.reviewStatus||"draft";
}

function canPublish(q){
  return status(q)==="ready" &&
    q.officialChecked===true &&
    q.verified===true &&
    (!q.needsFigure||!!q.figurePath) &&
    valid(q) &&
    Number.isInteger(q.answer) &&
    q.answer>=1 &&
    q.answer<=5 &&
    typeof q.question==="string" &&
    q.question.trim() &&
    typeof q.subject==="string" &&
    q.subject.trim() &&
    typeof q.source==="string" &&
    q.source.trim() &&
    typeof q.explanation==="string" &&
    q.explanation.trim() &&
    q.options.every(o=>
      typeof o.text==="string" &&
      o.text.trim() &&
      typeof o.explanation==="string" &&
      o.explanation.trim()
    );
}

function render(){
  const counts={
    draft:0,
    review:0,
    figure:0,
    ready:0
  };

  for(let n=1;n<=200;n++){
    const s=status(get(n));
    counts[s]=(counts[s]||0)+1;
  }

  const ready=Array.from(
    {length:200},(_,i)=>get(i+1)
  ).filter(canPublish).length;

  $("stats").innerHTML=`
    <div class="stat"><b>${counts.draft}</b>未確認</div>
    <div class="stat"><b>${counts.review}</b>校閲中</div>
    <div class="stat"><b>${counts.figure}</b>図表待ち</div>
    <div class="stat"><b>${ready}</b>公開条件達成</div>
  `;

  $("message").textContent=
    `200問中、公開条件を満たす問題：${ready}問。`;

  const filter=$("filter").value;
  const term=$("search").value.toLowerCase();
  const list=$("list");

  list.replaceChildren();

  for(let n=1;n<=200;n++){
    const q=get(n);

    if(filter!=="all"&&status(q)!==filter)continue;

    if(term&&!`${n} ${q.subject} ${q.title} ${q.question}`
      .toLowerCase().includes(term))continue;

    const div=document.createElement("div");
    div.className="item";

    const label=document.createElement("span");
    label.textContent=
      `問${n}｜${q.subject||"科目未設定"}｜${q.title||"未登録"} `;

    const tag=document.createElement("span");
    tag.className="tag";

    tag.textContent=({
      draft:"未確認",
      review:"校閲中",
      figure:"図表待ち",
      ready:"公開可能"
    }[status(q)]||"未確認")+(canPublish(q)?" ✓":"");

    const btn=document.createElement("button");
    btn.className="secondary";
    btn.style.marginLeft="8px";
    btn.textContent="編集";
    btn.onclick=()=>edit(n);

    div.append(label,tag,btn);
    list.appendChild(div);
  }
}

function edit(n){
  current=n;
  const q=get(n);

  $("number").value=n;
  $("subject").value=q.subject||"";
  $("title").value=q.title||"";
  $("question").value=q.question||"";
  $("answer").value=q.answer||1;
  $("explanation").value=q.explanation||"";
  $("source").value=q.source||"";
  $("status").value=status(q);
  $("official").checked=q.officialChecked===true;
  $("checked").checked=q.verified===true;
  $("needsFigure").checked=q.needsFigure===true;
  $("figurePath").value=q.figurePath||"";

  const area=$("optionInputs");
  area.replaceChildren();

  for(let i=0;i<5;i++){
    const t=document.createElement("label");
    t.textContent=`選択肢${i+1}`;

    const a=document.createElement("textarea");
    a.id=`opt${i}`;
    a.value=q.options?.[i]?.text||"";
    a.rows=2;

    const l=document.createElement("label");
    l.textContent=`選択肢${i+1}の解説`;

    const b=document.createElement("textarea");
    b.id=`exp${i}`;
    b.value=q.options?.[i]?.explanation||"";
    b.rows=2;

    area.append(t,a,l,b);
  }

  $("editInfo").textContent=`第40回 問${n}を編集中`;
  $("editor").scrollIntoView({behavior:"smooth"});
}

function newItem(){
  const n=Number($("number").value);

  if(Number.isInteger(n)&&n>=1&&n<=200){
    edit(n);
  }else{
    alert("問番号は1〜200で入力してください");
  }
}

function saveItem(){
  const n=Number($("number").value);

  if(!Number.isInteger(n)||n<1||n>200){
    alert("問番号は1〜200です");
    return;
  }

  const q={
    ...base(n),
    subject:$("subject").value.trim(),
    title:$("title").value.trim(),
    question:$("question").value.trim(),
    options:Array.from({length:5},(_,i)=>({
      text:$(`opt${i}`).value.trim(),
      explanation:$(`exp${i}`).value.trim()
    })),
    answer:Number($("answer").value),
    explanation:$("explanation").value.trim(),
    source:$("source").value.trim(),
    reviewStatus:$("status").value,
    officialChecked:$("official").checked,
    verified:$("checked").checked,
    needsFigure:$("needsFigure").checked,
    figurePath:$("figurePath").value.trim()
  };

  if(!Number.isInteger(q.answer)||q.answer<1||q.answer>5){
    alert("正答は1〜5です");
    return;
  }

  records[n]=q;
  persist();
  render();

  $("editInfo").textContent=
    `問${n}を保存しました。公開条件：${canPublish(q)?"合格":"未達"}`;
}

async function importFile(){
  const file=$("file").files?.[0];

  if(!file){
    alert("JSONファイルを選択してください");
    return;
  }

  try{
    const raw=JSON.parse(await file.text());

    const arr=Array.isArray(raw)
      ?raw
      :Array.isArray(raw.questions)
        ?raw.questions
        :Object.values(raw);

    if(!Array.isArray(arr)||!arr.length){
      throw Error("問題配列がありません");
    }

    const incoming={};

    for(const item of arr){
      const q={...item};

      if(Array.isArray(q.options)){
        q.options=q.options.map((o,i)=>
          typeof o==="string"
          ?{
            text:o,
            explanation:Array.isArray(q.explanations)
              ?q.explanations[i]||""
              :""
          }
          :o
        );
      }

      if(Number.isInteger(q.answer)&&q.answer>=0&&q.answer<=4
         &&Array.isArray(item.explanations)){
        q.answer=q.answer+1;
      }

      if(!valid(q)){
        throw Error("第40回の問番号1〜200・選択肢5件が必要です");
      }

      incoming[q.questionNumber]={
        ...base(q.questionNumber),
        ...q,
        reviewStatus:q.reviewStatus||"draft",
        verified:q.verified===true,
        officialChecked:q.officialChecked===true
      };
    }

    Object.assign(records,incoming);
    persist();
    render();

    alert(`${Object.keys(incoming).length}問を取り込みました。`);
  }catch(e){
    alert("取込失敗："+e.message);
  }
}

function download(data,name){
  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=name;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),30000);
}

function exportAll(){
  download(
    Array.from({length:200},(_,i)=>get(i+1)),
    "hirano-40-working-all.json"
  );
}

function exportPublished(){
  const arr=Array.from(
    {length:200},(_,i)=>get(i+1)
  )
  .filter(canPublish)
  .map(q=>{
    const o={...q};
    delete o.reviewStatus;
    delete o.needsFigure;
    return o;
  });

  if(!arr.length){
    alert("公開可能な問題がありません。");
    return;
  }

  download(arr,"questions.json");

  alert(
    `${arr.length}問を出力しました。`+
    "GitHubの同名ファイルにアップロードしてください。"
  );
}

function logout(){
  sessionStorage.removeItem("hirano-bulk-login");
  location.reload();
}

function unlock(){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  render();
  edit(1);
}

$("loginForm").addEventListener("submit",e=>{
  e.preventDefault();

  if($("pass").value===PASS){
    sessionStorage.setItem("hirano-bulk-login","yes");
    unlock();
  }else{
    alert("パスワードが違います");
  }
});

if(sessionStorage.getItem("hirano-bulk-login")==="yes"){
  unlock();
}
</script>
</body>
</html>

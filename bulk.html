
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>200問一括管理｜ひらのの栄養教室</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f8f7;color:#203a36;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
header{background:#116e67;color:white;padding:18px}
main{max-width:900px;margin:auto;padding:14px}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 8px #0001}
button,input,select,textarea{font:inherit;padding:10px;border:1px solid #c7d7d0;border-radius:8px;max-width:100%}
button{background:#116e67;color:white;cursor:pointer}
button.secondary{background:white;color:#116e67}
textarea{width:100%;min-height:75px}
label{display:block;margin:12px 0 4px;font-weight:600}
input[type=text],input[type=number],input[type=password],select{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.muted{color:#607a70;font-size:13px;line-height:1.6}
.hidden{display:none}
.item{padding:12px;border:1px solid #d9e5df;border-radius:10px;margin:9px 0}
.tag{display:inline-block;border-radius:30px;padding:4px 8px;background:#eaf5f0;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:#eaf5f0;text-align:center;border-radius:9px;padding:10px}
.stat b{display:block;font-size:22px}
a{color:#116e67}
.option-card{border:1px solid #d9e5df;border-radius:10px;padding:12px;margin:10px 0}
.warning{background:#fff7e7;padding:12px;border-radius:10px;font-size:13px;line-height:1.6}
.success{background:#eaf5f0;padding:12px;border-radius:10px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.row{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>

<header>
<b>ひらのの栄養教室</b>
<div>第40回・200問 一括登録／校閲管理</div>
</header>

<main>
<section class="card" id="login">
<h2>管理者ログイン</h2>
<form id="loginForm">
<input id="pass" type="password" inputmode="numeric" placeholder="パスワード" required>
<p><button>ログイン</button></p>
</form>
<p class="muted">このログインは簡易的な画面ロックであり、安全な認証ではありません。</p>
</section>

<section id="app" class="hidden">

<div class="card">
<div class="row">
<a href="admin.html">管理者メニューへ</a>
<a href="index.html">一般公開画面へ</a>
<button class="secondary" onclick="logout()">ログアウト</button>
</div>
<p class="muted">編集データはこの端末に保存されます。作業用JSONを定期的に書き出してください。</p>
</div>

<div class="card">
<h2>進捗</h2>
<div class="grid" id="stats"></div>
<p class="muted" id="message"></p>
</div>

<div class="card">
<h2>一括取り込み・書き出し</h2>
<input id="file" type="file" accept=".json,application/json">
<div class="row" style="margin-top:10px">
<button onclick="importFile()">JSON一括取込</button>
<button class="secondary" onclick="exportAll()">作業用全件バックアップ</button>
<button onclick="exportPublished()">公開用 questions.json</button>
</div>
<p class="muted">公開用ファイルには、公開条件を満たす問題だけを収録します。</p>
</div>

<div class="card">
<h2>問題一覧</h2>
<div class="row">
<select id="filter" onchange="render()">
<option value="all">全ステータス</option>
<option value="draft">未確認</option>
<option value="review">校閲中</option>
<option value="figure">図表待ち</option>
<option value="ready">公開可能</option>
</select>
<input id="search" type="text" placeholder="問番号・科目・キーワード" oninput="render()">
</div>
<div id="list"></div>
</div>

<div class="card" id="editor">
<h2>問題を編集</h2>

<label>問番号（1〜200）</label>
<input id="number" type="number" min="1" max="200">

<label>科目</label>
<input id="subject" type="text">

<label>問題の題名</label>
<input id="title" type="text">

<label>設問文</label>
<textarea id="question"></textarea>

<div id="optionInputs"></div>

<label>公式正答番号（1〜5）</label>
<input id="answer" type="number" min="1" max="5">

<div class="warning">
正答番号は「どの選択肢を選べば得点になるか」です。<br>
選択肢○×は「その選択肢の文章が正しいか」です。<br>
「誤っているものを選べ」では両者が一致しないことがあります。
</div>

<label>総合解説</label>
<textarea id="explanation"></textarea>

<label>出典</label>
<input id="source" type="text">

<label>公開状態</label>
<select id="status">
<option value="draft">未確認</option>
<option value="review">校閲中</option>
<option value="figure">図表待ち</option>
<option value="ready">公開可能</option>
</select>

<label><input id="official" type="checkbox"> 公式問題・正答を照合済み</label>
<label><input id="checked" type="checkbox"> 5肢の解説を校閲済み</label>
<label><input id="needsFigure" type="checkbox"> 解答に図表が必要</label>

<label>自作図のパス</label>
<input id="figurePath" type="text" placeholder="images/questions/40-001.webp">

<div class="row" style="margin-top:14px">
<button onclick="saveItem()">変更を保存</button>
<button class="secondary" onclick="openNumber()">指定した問番号を開く</button>
</div>
<p class="muted" id="editInfo"></p>
<div id="validation"></div>
</div>

</section>
</main>

<script>
"use strict";

const KEY="hirano-bulk-v1";
const PASS="0907";

let records=load();
let current=1;

function $(id){return document.getElementById(id)}

function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY)||"{}");
  return x&&typeof x==="object"&&!Array.isArray(x)?x:{};
 }catch{return {}}
}

function persist(){
 try{localStorage.setItem(KEY,JSON.stringify(records))}
 catch{alert("保存できません。作業用JSONを出力してください。")}
}

function base(n){
 return {
  id:`40-${String(n).padStart(3,"0")}`,
  type:"exam",
  examNumber:40,
  questionNumber:n,
  answerBase:1,
  subject:"",
  title:"",
  question:"",
  options:Array.from({length:5},()=>({text:"",explanation:""})),
  optionsCorrect:[null,null,null,null,null],
  answer:1,
  explanation:"",
  source:"厚生労働省 第40回管理栄養士国家試験",
  officialChecked:false,
  verified:false,
  reviewStatus:"draft",
  needsFigure:false,
  figurePath:""
 };
}

function normalizeIncoming(item){
 if(!item||typeof item!=="object")throw Error("問題形式が不正です");

 const n=Number(item.questionNumber);
 if(!Number.isInteger(n)||n<1||n>200)throw Error("問番号は1〜200です");
 if(Number(item.examNumber)!==40)throw Error(`問${n}：第40回ではありません`);

 const q={...base(n),...item};

 if(!Array.isArray(q.options)||q.options.length!==5){
  throw Error(`問${n}：選択肢は5件必要です`);
 }

 q.options=q.options.map((o,i)=>typeof o==="string"
  ?{text:o,explanation:Array.isArray(q.explanations)?q.explanations[i]||"":""}
  :{text:String(o?.text||""),explanation:String(o?.explanation||"")});

 if(q.answerBase===0){
  q.answer=Number(q.answer)+1;
  q.answerBase=1;
 }else if(q.answerBase===undefined){
  // 旧bulk.htmlのデータは1始まり
  q.answerBase=1;
 }

 if(!Number.isInteger(q.answer)||q.answer<1||q.answer>5){
  throw Error(`問${n}：正答番号が不正です`);
 }

 if(!Array.isArray(q.optionsCorrect)||q.optionsCorrect.length!==5){
  q.optionsCorrect=[null,null,null,null,null];
 }

 q.optionsCorrect=q.optionsCorrect.map(v=>
  typeof v==="boolean"?v:null
 );

 q.reviewStatus=["draft","review","figure","ready"].includes(q.reviewStatus)
  ?q.reviewStatus:"draft";

 q.officialChecked=q.officialChecked===true;
 q.verified=q.verified===true;
 q.needsFigure=q.needsFigure===true;

 return q;
}

function get(n){
 try{
  return records[n]?normalizeIncoming(records[n]):base(n);
 }catch{
  return base(n);
 }
}

function issues(q){
 const errors=[];

 if(!q.question.trim())errors.push("問題文がありません");
 if(!q.subject.trim())errors.push("科目がありません");
 if(!q.source.trim())errors.push("出典がありません");

 if(!Number.isInteger(q.answer)||q.answer<1||q.answer>5){
  errors.push("正答番号が不正です");
 }

 if(q.options.some(o=>!o.text.trim())){
  errors.push("未入力の選択肢があります");
 }

 if(q.options.some(o=>!o.explanation.trim())){
  errors.push("未入力の選択肢解説があります");
 }

 if(!q.explanation.trim()){
  errors.push("総合解説がありません");
 }

 if(!q.optionsCorrect.every(v=>typeof v==="boolean")){
  errors.push("各選択肢の○×判定が未完了です");
 }

 if(!q.officialChecked){
  errors.push("公式問題・正答が未照合です");
 }

 if(!q.verified){
  errors.push("解説が未校閲です");
 }

 if(q.needsFigure&&!q.figurePath.trim()){
  errors.push("必要な図表が未登録です");
 }

 if(q.reviewStatus!=="ready"){
  errors.push("公開状態が「公開可能」ではありません");
 }

 return errors;
}

function canPublish(q){
 return issues(q).length===0;
}

function render(){
 const counts={draft:0,review:0,figure:0,ready:0};
 let publishable=0;

 for(let n=1;n<=200;n++){
  const q=get(n);
  counts[q.reviewStatus]++;
  if(canPublish(q))publishable++;
 }

 $("stats").innerHTML=`
  <div class="stat"><b>${counts.draft}</b>未確認</div>
  <div class="stat"><b>${counts.review}</b>校閲中</div>
  <div class="stat"><b>${counts.figure}</b>図表待ち</div>
  <div class="stat"><b>${publishable}</b>公開条件達成</div>
 `;

 $("message").textContent=`第40回200問中、公開条件を満たす問題：${publishable}問`;

 const filter=$("filter").value;
 const term=$("search").value.toLowerCase();
 const list=$("list");
 list.replaceChildren();

 for(let n=1;n<=200;n++){
  const q=get(n);
  if(filter!=="all"&&q.reviewStatus!==filter)continue;

  if(term&&!`${n} ${q.subject} ${q.title} ${q.question}`.toLowerCase().includes(term)){
   continue;
  }

  const div=document.createElement("div");
  div.className="item";

  const label=document.createElement("div");
  label.textContent=`問${n}｜${q.subject||"科目未設定"}｜${q.title||"未登録"}`;

  const tag=document.createElement("span");
  tag.className="tag";
  tag.textContent=({
   draft:"未確認",
   review:"校閲中",
   figure:"図表待ち",
   ready:"公開可能"
  }[q.reviewStatus])+(canPublish(q)?" ✓":"");

  const btn=document.createElement("button");
  btn.className="secondary";
  btn.style.marginLeft="8px";
  btn.textContent="編集";
  btn.onclick=()=>edit(n);

  div.append(label,tag,btn);
  list.appendChild(div);
 }
}

function edit(n){
 current=n;
 const q=get(n);

 $("number").value=n;
 $("subject").value=q.subject;
 $("title").value=q.title;
 $("question").value=q.question;
 $("answer").value=q.answer;
 $("explanation").value=q.explanation;
 $("source").value=q.source;
 $("status").value=q.reviewStatus;
 $("official").checked=q.officialChecked;
 $("checked").checked=q.verified;
 $("needsFigure").checked=q.needsFigure;
 $("figurePath").value=q.figurePath;

 const area=$("optionInputs");
 area.replaceChildren();

 for(let i=0;i<5;i++){
  const section=document.createElement("div");
  section.className="option-card";

  const heading=document.createElement("h3");
  heading.textContent=`選択肢 ${i+1}`;

  const text=document.createElement("textarea");
  text.id=`opt${i}`;
  text.value=q.options[i].text;
  text.placeholder="選択肢の文章";

  const label=document.createElement("label");
  label.textContent="文章自体の正誤";

  const select=document.createElement("select");
  select.id=`correct${i}`;

  [
   ["","未判定"],
   ["true","○ 正しい"],
   ["false","× 誤り"]
  ].forEach(([value,title])=>{
   const option=document.createElement("option");
   option.value=value;
   option.textContent=title;
   select.appendChild(option);
  });

  select.value=q.optionsCorrect[i]===null?"":String(q.optionsCorrect[i]);

  const expLabel=document.createElement("label");
  expLabel.textContent="選択肢の解説";

  const exp=document.createElement("textarea");
  exp.id=`exp${i}`;
  exp.value=q.options[i].explanation;
  exp.placeholder="正誤の根拠を入力";

  section.append(heading,text,label,select,expLabel,exp);
  area.appendChild(section);
 }

 showValidation(q);
 $("editInfo").textContent=`第40回 問${n}を編集中`;
 $("editor").scrollIntoView({behavior:"smooth"});
}

function readEditor(){
 const n=Number($("number").value);
 if(!Number.isInteger(n)||n<1||n>200)throw Error("問番号は1〜200です");

 return {
  ...base(n),
  subject:$("subject").value.trim(),
  title:$("title").value.trim(),
  question:$("question").value.trim(),
  options:Array.from({length:5},(_,i)=>({
   text:$(`opt${i}`).value.trim(),
   explanation:$(`exp${i}`).value.trim()
  })),
  optionsCorrect:Array.from({length:5},(_,i)=>{
   const v=$(`correct${i}`).value;
   return v===""?null:v==="true";
  }),
  answer:Number($("answer").value),
  explanation:$("explanation").value.trim(),
  source:$("source").value.trim(),
  reviewStatus:$("status").value,
  officialChecked:$("official").checked,
  verified:$("checked").checked,
  needsFigure:$("needsFigure").checked,
  figurePath:$("figurePath").value.trim()
 };
}

function showValidation(q){
 const errors=issues(q);
 const area=$("validation");
 area.replaceChildren();

 const div=document.createElement("div");
 div.className=errors.length?"warning":"success";

 if(errors.length){
  const title=document.createElement("strong");
  title.textContent=`公開前の確認事項：${errors.length}件`;
  div.appendChild(title);

  const ul=document.createElement("ul");
  errors.forEach(message=>{
   const li=document.createElement("li");
   li.textContent=message;
   ul.appendChild(li);
  });
  div.appendChild(ul);
 }else{
  div.textContent="公開条件を満たしています。";
 }

 area.appendChild(div);
}

function saveItem(){
 try{
  const q=readEditor();

  if(!Number.isInteger(q.answer)||q.answer<1||q.answer>5){
   throw Error("正答番号は1〜5です");
  }

  records[q.questionNumber]=q;
  persist();
  render();
  showValidation(q);
  $("editInfo").textContent=`問${q.questionNumber}を保存しました。`;
 }catch(e){
  alert("保存失敗："+e.message);
 }
}

function openNumber(){
 const n=Number($("number").value);
 if(Number.isInteger(n)&&n>=1&&n<=200){
  edit(n);
 }else{
  alert("問番号は1〜200です");
 }
}

async function importFile(){
 const file=$("file").files?.[0];
 if(!file){
  alert("JSONファイルを選択してください");
  return;
 }

 try{
  const raw=JSON.parse(await file.text());
  const arr=Array.isArray(raw)?raw:Array.isArray(raw.questions)?raw.questions:null;
  if(!arr||!arr.length)throw Error("問題配列がありません");

  const incoming={};

  for(const item of arr){
   const q=normalizeIncoming(item);
   if(incoming[q.questionNumber])throw Error(`問${q.questionNumber}が重複しています`);
   incoming[q.questionNumber]=q;
  }

  const count=Object.keys(incoming).length;

  if(!confirm(`${count}問を取り込みます。同じ問番号は上書きされます。よろしいですか？`)){
   return;
  }

  Object.assign(records,incoming);
  persist();
  render();
  edit(1);
  alert(`${count}問を取り込みました。`);
 }catch(e){
  alert("取込失敗："+e.message);
 }

 $("file").value="";
}

function download(data,name){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}

function exportAll(){
 download(Array.from({length:200},(_,i)=>get(i+1)),"hirano-40-working-all.json");
}

function exportPublished(){
 const arr=Array.from({length:200},(_,i)=>get(i+1))
  .filter(canPublish)
  .map(q=>({
   ...q,
   answerBase:1,
   questionImage:q.figurePath||""
  }));

 if(!arr.length){
  alert("公開可能な問題がありません。");
  return;
 }

 download(arr,"questions.json");
 alert(`${arr.length}問を出力しました。GitHubにアップロードしてください。`);
}

function logout(){
 sessionStorage.removeItem("hirano-bulk-login");
 location.reload();
}

function unlock(){
 $("login").classList.add("hidden");
 $("app").classList.remove("hidden");
 render();
 edit(1);
}

$("loginForm").addEventListener("submit",e=>{
 e.preventDefault();
 if($("pass").value===PASS){
  sessionStorage.setItem("hirano-bulk-login","yes");
  unlock();
 }else{
  alert("パスワードが違います");
 }
});

if(sessionStorage.getItem("hirano-bulk-login")==="yes"){
 unlock();
}
</script>
</body>
</html>
